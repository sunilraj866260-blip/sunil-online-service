
<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>निवेदन फारम - Sunil Photo Studio</title>

  <!-- Firebase Core & Database SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f8f9fa;
    }

    /* फारमको लेआउट स्टाइल */
    .form-container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border: 1px solid #ddd;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    /* प्रिन्ट गर्दा फारम बाहेकका बटन र पप-अपहरू नदेखिने बनाउने CSS Rules */
    @media print {
      .no-print, #paymentModal {
        display: none !important;
      }
      body {
        background-color: #fff;
        margin: 0;
      }
      .form-container {
        border: none;
        box-shadow: none;
        width: 100%;
        max-width: 100%;
      }
    }

    /* Pop-up Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 9999;
    }

    .modal-box {
      background: #fff;
      max-width: 440px;
      margin: 60px auto;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      position: relative;
    }

    .close-btn {
      position: absolute;
      right: 15px;
      top: 10px;
      cursor: pointer;
      font-size: 24px;
      font-weight: bold;
      color: #666;
    }

    .form-input {
      width: 100%;
      padding: 10px;
      margin: 6px 0 14px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .btn-action {
      width: 100%;
      padding: 11px;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-submit { background-color: #007bff; }
    .btn-submit:hover { background-color: #0069d9; }
    .btn-trace { background-color: #17a2b8; }
    .btn-trace:hover { background-color: #138496; }
    
    .status-msg {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- ================= फारम सेक्सन (तपाईंको पुरानो फारमको कोड यहाँ रहन्छ) ================= -->
  <div class="form-container">
    <h2 style="text-align: center;">जन्मदर्ता सिफारिस निवेदन</h2>
    <p>श्रीमान् वडा अध्यक्ष ज्यू,<br> वडा कार्यालय...</p>

    <!-- उदाहरणका लागि input box हरू -->
    <p>निवेदकको नाम: <input type="text" placeholder="नाम भर्नुहोस्"></p>
    <p>ठेगाना: <input type="text" placeholder="ठेगाना भर्नुहोस्"></p>
    <p>मिती: <input type="date"></p>
    <br><br>

    <!-- प्रिन्ट बटन (प्रिन्ट गर्दा यो लुक्छ) -->
    <div class="no-print" style="text-align: center; margin-top: 30px;">
      <button type="button" onclick="openPaymentModal()" style="padding: 12px 25px; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
        🖨️ निवेदन प्रिन्ट / डाउनलोड गर्नुहोस्
      </button>
    </div>
  </div>


  <!-- ================= PAYMENT & TRACE POP-UP MODAL ================= -->
  <div id="paymentModal" class="modal-overlay">
    <div class="modal-box">
      <span class="close-btn" onclick="closePaymentModal()">&times;</span>

      <h3 style="margin-top: 0; color: #0056b3; text-align: center;">भुक्तानी तथा भेरिफिकेसन</h3>
      <p style="font-size: 13px; color: #555; text-align: center; margin-bottom: 15px;">
        निवेदन प्रिन्ट गर्न रु. ५० eSewa / Khalti QR मा भुक्तानी गर्नुहोस्।
      </p>

      <!-- १. नयाँ पेमेन्ट रिक्वेस्ट पठाउने -->
      <div style="background: #f0f7ff; padding: 12px; border-radius: 6px; border-left: 4px solid #007bff;">
        <h4 style="margin: 0 0 8px 0;">१. भुक्तानी अनुरोध (Send Request):</h4>
        <input type="text" id="custName" class="form-input" placeholder="तपाईंको पुरा नाम">
        <input type="text" id="custTxId" class="form-input" placeholder="eSewa / Khalti Transaction ID">
        <button onclick="sendPrintRequest()" class="btn-action btn-submit">अनुरोध (Request) पठाउनुहोस्</button>
      </div>

      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

      <!-- २. १ घण्टापछि आएर Trace गरेर Print गर्ने -->
      <div style="background: #fff8e6; padding: 12px; border-radius: 6px; border-left: 4px solid #ffc107;">
        <h4 style="margin: 0 0 8px 0;">२. पेमेन्ट ट्रेस / भेरिफाई गरी प्रिन्ट गर्नुहोस्:</h4>
        <input type="text" id="traceTxId" class="form-input" placeholder="Transaction ID यहाँ राख्नुहोस्">
        <button onclick="traceAndPrint()" class="btn-action btn-trace">Trace & Print Document</button>
      </div>

      <!-- Status Message Box -->
      <div id="modalStatus" class="status-msg"></div>
    </div>
  </div>


  <!-- ================= JAVASCRIPT LOGIC ================= -->
  <script>
    // १. Firebase Setup
    const firebaseConfig = {
      apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
      databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // Pop-up खोल्ने र बन्द गर्ने फसनहरू
    function openPaymentModal() {
      document.getElementById('paymentModal').style.display = 'block';
    }
    function closePaymentModal() {
      document.getElementById('paymentModal').style.display = 'none';
      document.getElementById('modalStatus').innerText = '';
    }

    // २. नयाँ पेमेन्ट रिक्वेस्ट Firebase मा पठाउने
    function sendPrintRequest() {
      const name = document.getElementById('custName').value.trim();
      const txId = document.getElementById('custTxId').value.trim();
      const statusBox = document.getElementById('modalStatus');

      if (!name || !txId) {
        alert("कृपया नाम र Transaction ID दुवै भर्नुहोस्!");
        return;
      }

      statusBox.style.color = "blue";
      statusBox.innerText = "अनुरोध पठाइँदै छ...";

      // फाइलको नाम स्वतः लिने (जस्तै: janamdarta.html)
      const currentFileName = window.location.pathname.split("/").pop() || "Nivedan.html";

      database.ref('requests/' + txId).set({
        name: name,
        transactionId: txId,
        fileName: currentFileName,
        status: "Pending",
        timestamp: Date.now()
      }).then(() => {
        statusBox.style.color = "green";
        statusBox.innerHTML = `अनुरोध दर्ता भयो!<br><span style='color:red;'>Transaction ID: ${txId}</span> सुरक्षित राख्नुहोस्। स्वीकृत भएपछि यहाँ आइ Trace गरेर प्रिन्ट गर्नुहोस्।`;
      }).catch(error => {
        statusBox.style.color = "red";
        statusBox.innerText = "त्रुटि: " + error.message;
      });
    }

    // ३. Transaction ID ट्रेस गरेर Approved छ भने मात्र Print Dialog खोल्ने
    function traceAndPrint() {
      const txId = document.getElementById('traceTxId').value.trim();
      const statusBox = document.getElementById('modalStatus');

      if (!txId) {
        alert("कृपया Transaction ID राख्नुहोस्!");
        return;
      }

      statusBox.style.color = "blue";
      statusBox.innerText = "पेमेन्ट ट्रेस जाँदै छ...";

      database.ref('requests/' + txId).once('value').then((snapshot) => {
        const data = snapshot.val();

        if (!data) {
          statusBox.style.color = "red";
          statusBox.innerText = "यो Transaction ID भेटिएन। कृपया सही ID राख्नुहोस्।";
        } else if (data.status === "Approved") {
          statusBox.style.color = "green";
          statusBox.innerText = "भुक्तानी स्वीकृत भयो! प्रिन्ट सुरु हुँदैछ...";

          // Pop-up बन्द गर्ने र Browser को Print Dialog खोल्ने
          setTimeout(() => {
            closePaymentModal();
            window.print();
          }, 1000);

        } else if (data.status === "Pending") {
          statusBox.style.color = "#e67e22";
          statusBox.innerText = "पेमेन्ट अझै भेरिफिकेसनको पर्खाइमा छ। स्टुडियोबाट Approved भएपछि पुनः प्रयास गर्नुहोस्।";
        }
      });
    }
  </script>
</body>
</html>
