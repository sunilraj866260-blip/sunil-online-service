<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन प्यानल - रोहिणी वडा</title>
    
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .header { background: #1e3799; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header h2 { margin: 0; font-size: 24px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #1e3799; color: white; font-size: 15px; }
        tr:hover { background-color: #f8f9fa; }
        
        .badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; }
        .badge-pending { background: #ffeaa7; color: #d35400; border: 1px solid #e67e22; }
        .badge-approved { background: #badc58; color: #27ae60; border: 1px solid #27ae60; }
        
        .btn { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-approve { background: #27ae60; color: white; margin-right: 5px; }
        .btn-approve:hover { background: #219150; }
        .btn-delete { background: #e74c3c; color: white; }
        .btn-delete:hover { background: #c0392b; }
    </style>
</head>
<body>

<div class="header">
    <h2>एडमिन प्यानल (Admin Dashboard)</h2>
</div>

<div class="container">
    <h3 style="margin-top:0; color:#1e3799;">प्राप्त निवेदनहरू र eSewa Verification</h3>
    <table>
        <thead>
            <tr>
                <th>मिति</th>
                <th>निवेदकको नाम</th>
                <th>eSewa Code</th>
                <th>फोन नं.</th>
                <th>अवस्था (Status)</th>
                <th>कार्य (Action)</th>
            </tr>
        </thead>
        <tbody id="requestTableBody">
            <tr><td colspan="6" style="text-align: center;">लोड हुँदैछ...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // Firebase Setup
    const firebaseConfig = {
        apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
        databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Fetch Requests from Firebase Realtime Database
    database.ref('requests').on('value', (snapshot) => {
        const tableBody = document.getElementById('requestTableBody');
        tableBody.innerHTML = '';

        if (!snapshot.exists()) {
            tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #777;">कुनै अनुरोध भेटिएन।</td></tr>`;
            return;
        }

        const data = snapshot.val();
        Object.keys(data).reverse().forEach((key) => {
            const req = data[key];
            const isApproved = req.status === 'APPROVED';

            let statusBadge = isApproved 
                ? '<span class="badge badge-approved">VERIFIED (Paid)</span>' 
                : '<span class="badge badge-pending">PENDING (Watermark)</span>';

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${req.today || '-'}</td>
                <td><b>${req.applicant_name || '-'}</b></td>
                <td><strong style="color:#2e7d32; font-size:15px;">${req.esewa_code || '-'}</strong></td>
                <td>${req.phone || '-'}</td>
                <td>${statusBadge}</td>
                <td>
                    ${!isApproved ? `<button class="btn btn-approve" onclick="verifyPayment('${key}')">Approve Payment</button>` : ''}
                    <button class="btn btn-delete" onclick="deleteRequest('${key}')">Delete</button>
                </td>
            `;
            tableBody.appendChild(row);
        });
    });

    // Approve Payment Function (Removes Watermark on User Side)
    function verifyPayment(key) {
        if (confirm("के eSewa मा रकम प्राप्त भएको पक्का छ? स्वीकृत गरेपछि Watermark हट्नेछ।")) {
            database.ref('requests/' + key).update({ status: 'APPROVED' })
            .then(() => alert("सफलतापूर्वक स्वीकृत भयो! अब प्रयोगकर्ताले सफा A4 प्रिन्ट पाउन सक्नेछन्।"))
            .catch((err) => alert("त्रुटि: " + err.message));
        }
    }

    // Delete Request
    function deleteRequest(key) {
        if (confirm('के तपाईँ यो निवेदन हटाउन चाहनुहुन्छ?')) {
            database.ref('requests/' + key).remove();
        }
    }
</script>

</body>
</html>
