<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunil Service - Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f4f6f9; color: #333; }
        .header { background: #1e3799; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .card { background: white; padding: 18px; margin-bottom: 12px; border-radius: 8px; border-left: 6px solid #ff9f43; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .card.approved { border-left-color: #27ae60; background: #f8fff9; }
        .info p { margin: 3px 0; font-size: 15px; }
        .btn-approve { background: #27ae60; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .btn-approve:hover { background: #219150; }
        .badge { background: #e74c3c; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .badge-success { background: #27ae60; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🔐 Sunil Online Service - Payment Approval Panel</h2>
    </div>

    <h3>📥 आएका अनुरोधहरू (Real-time Pending Requests)</h3>
    <div id="requestList" style="margin-top: 15px;">लोड हुँदैछ...</div>

    <script>
        // FIREBASE SETUP (यहाँ पनि आफ्नो विवरण हाल्नुहोस्)
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Realtime Data Fetching
        database.ref('requests').on('value', (snapshot) => {
            const listDiv = document.getElementById('requestList');
            listDiv.innerHTML = "";
            const data = snapshot.val();

            if (!data) {
                listDiv.innerHTML = "<p style='color:#777;'>कुनै पनि अनुरोध आएको छैन।</p>";
                return;
            }

            for (let tx in data) {
                const item = data[tx];
                const isApproved = item.status === "APPROVED";

                listDiv.innerHTML += `
                    <div class="card ${isApproved ? 'approved' : ''}">
                        <div class="info">
                            <p><b>eSewa Tx ID:</b> <span style="color:#1e3799; font-size:17px;"><b>${tx}</b></span></p>
                            <p><b>निवेदक:</b> ${item.applicant} (${item.phone})</p>
                            <p><b>बच्चाको नाम:</b> ${item.child}</p>
                            <p><small style="color:#666;">मिति/समय: ${item.time}</small></p>
                            <p>स्थिति: <span class="badge ${isApproved ? 'badge-success' : ''}">${item.status}</span></p>
                        </div>
                        <div>
                            ${!isApproved ? `<button class="btn-approve" onclick="approveTx('${tx}')">✅ Approve (रु. १० प्राप्त भयो)</button>` : '<b style="color:#27ae60;">✓ अनलक भइसक्यो</b>'}
                        </div>
                    </div>
                `;
            }
        });

        function approveTx(tx) {
            database.ref('requests/' + tx + '/status').set("APPROVED");
            alert("Tx Code: " + tx + " Verified भयो! ग्राहकको PDF अनलक भइसकेको छ।");
        }
    </script>
</body>
</html>
