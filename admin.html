<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - वडा सिफारिस प्रणाली</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --primary: #1e3799; --secondary: #27ae60; --danger: #c0392b; --bg-light: #f4f7f6; }
        body { font-family: 'Arial', sans-serif; background-color: var(--bg-light); padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: 50px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .error-msg { color: var(--danger); font-size: 13px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container" id="login-box">
    <h2>Admin Login</h2>
    <form id="loginForm">
        <div class="input-group">
            <label>Admin Email:</label>
            <input type="email" id="admin_email" placeholder="admin@rochini1.gov.np" required>
        </div>
        <div class="input-group">
            <label>Password:</label>
            <input type="password" id="admin_pass" placeholder="********" required>
        </div>
        <button type="submit" class="btn-login">लगइन गर्नुहोस्</button>
        <div id="error-message" class="error-msg"></div>
    </form>
</div>

<!-- Admin Dashboard (Initially Hidden) -->
<div id="dashboard-box" style="display:none; max-width: 950px; margin: auto; background: white; padding: 20px; border-radius: 10px;">
    <h2>Admin Dashboard (रोहिणी-१)</h2>
    <p>स्वागत छ एड्मिन! तपाईं सफलतापूर्वक लगइन हुनुभएको छ।</p>
    <button onclick="logoutAdmin()" style="background:var(--danger); color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">लगआउट (Logout)</button>
    <!-- यहाँ तपाईंको आवेदनहरूको लिस्ट देखाउने टेबल राख्न सक्नुहुन्छ -->
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
        authDomain: "sunil-online-service.firebaseapp.com",
        databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com",
        projectId: "sunil-online-service",
        storageBucket: "sunil-online-service.appspot.com",
        messagingSenderId: "",
        appId: ""
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Check if already logged in
    auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('dashboard-box').style.display = 'block';
        } else {
            document.getElementById('login-box').style.display = 'block';
            document.getElementById('dashboard-box').style.display = 'none';
        }
    });

    // Login Form Submit Handler
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('admin_email').value.trim();
        const pass = document.getElementById('admin_pass').value.trim();
        const errorDiv = document.getElementById('error-message');

        auth.signInWithEmailAndPassword(email, pass)
            .then((userCredential) => {
                // Successful login
                errorDiv.innerText = "";
            })
            .catch((error) => {
                // Handle Errors
                errorDiv.innerText = "गलत इमेल वा पासवर्ड! कृपया पुन: प्रयास गर्नुहोस्।";
                console.error(error.message);
            });
    });

    // Logout Function
    function logoutAdmin() {
        auth.signOut().then(() => {
            alert('सफलतापूर्वक लगआउट हुनुभयो!');
        }).catch((error) => {
            console.error(error);
        });
    }
</script>

</body>
</html>
