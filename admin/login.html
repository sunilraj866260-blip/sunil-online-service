<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन लगइन - रोहिणी वडा १</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        h2 { color: #b71515; text-align: center; margin-top: 0; }
        input { width: 100%; padding: 10px; margin: 8px 0 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #b71515; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>एडमिन लगइन</h2>
    <label>युजरनेम:</label>
    <input type="text" id="user" placeholder="admin">
    <label>पासवर्ड:</label>
    <input type="password" id="pass" placeholder="******">
    <button onclick="login()">लगइन गर्नुहोस्</button>
</div>

<script>
    function login() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(u === "admin" && p === "admin123") {
            sessionStorage.setItem("adminLoggedIn", "true");
            window.location.href = "dashboard.html";
        } else {
            alert("गलत युजरनेम वा पासवर्ड!");
        }
    }
</script>
</body>
</html>
