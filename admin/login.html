<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - प्रणाली</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5;">

<div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px;">
    <h2 style="text-align: center; margin-bottom: 20px;">👨‍💼 Admin Login</h2>
    <form id="loginForm">
        <div style="margin-bottom: 15px;">
            <label>प्रयोगकर्ता नाम (User):</label>
            <input type="text" id="username" style="width: 100%; padding: 8px; margin-top: 5px;" required>
        </div>
        <div style="margin-bottom: 15px;">
            <label>पासवर्ड (Password):</label>
            <input type="password" id="password" style="width: 100%; padding: 8px; margin-top: 5px;" required>
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer;">लगइन गर्नुहोस्</button>
    </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;

    // साधारण सेक्युरिटी परीक्षणको लागि
    if(u === 'admin' && p === 'admin123') {
        localStorage.setItem('adminLoggedIn', 'true');
        window.location.href = 'dashboard.html';
    } else {
        alert('❌ अमान्य प्रयोगकर्ता वा पासवर्ड!');
    }
});
</script>
</body>
</html>
