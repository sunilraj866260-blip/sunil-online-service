
<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <title>Pending निवेदनहरू</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f9; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; }
        th { background: #d63031; color: white; }
    </style>
</head>
<body>
    <h2>⏳ पेन्डिङ (Pending) रहेका निवेदनहरू</h2>
    <a href="dashboard.html">← ड्यासबोर्डमा फर्कनुहोस्</a>
    <table>
        <thead>
            <tr>
                <th>निवेदक</th>
                <th>सेवा प्रकार</th>
                <th>फोन</th>
                <th>eSewa Code</th>
                <th>कार्य</th>
            </tr>
        </thead>
        <tbody id="pendingTable"></tbody>
    </table>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM", projectId: "https://sunil-online-service-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection('requests').where('status', '==', 'PENDING').onSnapshot(snapshot => {
        let html = '';
        snapshot.forEach(doc => {
            const data = doc.data();
            html += `<tr>
                <td>${data.applicant_name}</td>
                <td>${data.service_type}</td>
                <td>${data.phone}</td>
                <td>${data.esewa_code}</td>
                <td><a href="print.html?id=${doc.id}" target="_blank">Print गर्नुहाेस्</a></td>
            </tr>`;
        });
        document.getElementById('pendingTable').innerHTML = html;
    });
</script>
</body>
</html>
