<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पेन्डिङ निवेदनहरू</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 20px; }
        .header { background: #d35400; color: white; padding: 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .header a { color: white; text-decoration: none; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #d35400; color: white; }
        .btn-approve { padding: 6px 12px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h2>बाँकी (Pending) निवेदनहरू</h2>
    <a href="dashboard.html">← मुख्य ड्यासबोर्ड</a>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>निवेदक</th>
            <th>सेवा</th>
            <th>eSewa Txn ID</th>
            <th>फोन नं.</th>
            <th>कार्य</th>
        </tr>
    </thead>
    <tbody id="pendingBody"></tbody>
</table>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
        databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref("applications").orderByChild("status").equalTo("Pending").on("value", (snapshot) => {
        const tbody = document.getElementById('pendingBody');
        tbody.innerHTML = '';
        if (!snapshot.exists()) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">पेन्डिङ निवेदनहरू छैनन्।</td></tr>';
            return;
        }
        snapshot.forEach((childSnap) => {
            const d = childSnap.val();
            const id = childSnap.key;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${id}</b></td>
                <td>${d.fullName}</td>
                <td>${d.serviceType}</td>
                <td><strong style="color:#27ae60;">${d.esewaTxnId}</strong></td>
                <td>${d.mobile}</td>
                <td><button class="btn-approve" onclick="approve('${id}')">Verify & Approve</button></td>
            `;
            tbody.appendChild(tr);
        });
    });

    function approve(id) {
        if(confirm("स्वीकृत गर्ने?")) {
            db.ref("applications/" + id).update({ status: 'Approved' });
        }
    }
</script>
</body>
</html>
