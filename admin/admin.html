<!-- Firebase SDK (v8) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // Firebase Config (Must be fully declared)
    const firebaseConfig = {
        apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
        authDomain: "sunil-online-service.firebaseapp.com",
        databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com",
        projectId: "sunil-online-service",
        storageBucket: "sunil-online-service.appspot.com",
        messagingSenderId: "",
        appId: ""
    };
    
    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // Data Load Event
    database.ref('requests').on('value', (snapshot) => {
        const tableBody = document.getElementById('requestTableBody');
        tableBody.innerHTML = '';

        if (!snapshot.exists()) {
            tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 20px;">कुनै अनुरोध भेटिएन।</td></tr>`;
            return;
        }

        const data = snapshot.val();
        Object.keys(data).reverse().forEach((key) => {
            const req = data[key];
            let statusBadge = req.status === 'APPROVED' 
                ? '<span class="badge badge-approved">VERIFIED</span>' 
                : '<span class="badge badge-pending">PENDING</span>';

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${req.today || '-'}</td>
                <td><span class="token-code">${req.token || key}</span></td>
                <td><b>${req.applicant_name || 'अज्ञात निवेदक'}</b></td>
                <td><small>${req.type || 'निवेदन'}</small></td>
                <td><strong style="color:#2e7d32;">${req.esewa_code || req.paymentCode || 'हालिएको छैन'}</strong></td>
                <td>${statusBadge}</td>
                <td>
                    ${req.status !== 'APPROVED' ? `<button class="btn btn-approve" onclick="verifyPayment('${key}')">Verify & Approve</button>` : ''}
                    <button class="btn btn-delete" onclick="deleteRequest('${key}')">Delete</button>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }, (error) => {
        console.error("Firebase Read Error:", error);
        document.getElementById('requestTableBody').innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">डाटाबेस कनेक्ट हुन सकेन। (Error: ${error.message})</td></tr>`;
    });

    function verifyPayment(key) {
        if(confirm("eSewa मा रकम प्राप्त भयो? स्वीकृत (Verify) गर्ने?")) {
            database.ref('requests/' + key).update({ 
                status: 'APPROVED',
                paymentStatus: 'Paid'
            });
        }
    }

    function deleteRequest(key) {
        if (confirm('के तपाईँ यो निवेदन हटाउन चाहनुहुन्छ?')) {
            database.ref('requests/' + key).remove();
        }
    }
</script>
