<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन प्यानल - रोहिणी वडा</title>
    
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 20px; }
        .header { background: #1e3799; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; font-size: 14px; }
        th { background-color: #1e3799; color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; }
        .badge-pending { background: #ffeaa7; color: #d35400; }
        .badge-approved { background: #badc58; color: #27ae60; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 4px; }
        .btn-approve { background: #27ae60; color: white; }
        .btn-delete { background: #e74c3c; color: white; }
        .token-code { color: #1e3799; font-weight: bold; font-family: monospace; }
    </style>
</head>
<body>

<div class="header">
    <h2>एडमिन प्यानल (Admin Dashboard)</h2>
</div>

<div class="container">
    <h3>प्राप्त निवेदनहरू र eSewa Verification</h3>
    <table>
        <thead>
            <tr>
                <th>मिति</th>
                <th>टोकन नं.</th>
                <th>निवेदकको नाम</th>
                <th>प्रकार</th>
                <th>eSewa Code</th>
                <th>अवस्था (Status)</th>
                <th>कार्य (Action)</th>
            </tr>
        </thead>
        <tbody id="requestTableBody">
            <tr><td colspan="7" style="text-align: center;">लोड हुँदैछ...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
        databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    database.ref('requests').on('value', (snapshot) => {
        const tableBody = document.getElementById('requestTableBody');
        tableBody.innerHTML = '';

        if (!snapshot.exists()) {
            tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center;">कुनै अनुरोध भेटिएन।</td></tr>`;
            return;
        }

        const data = snapshot.val();
        Object.keys(data).reverse().forEach((key) => {
            const req = data[key];
            let statusBadge = req.status === 'APPROVED' 
                ? '<span class="badge badge-approved">VERIFIED</span>' 
                : '<span class="badge badge-pending">PENDING</span>';

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${req.today || ''}</td>
                <td><span class="token-code">${req.token || key}</span></td>
                <td><b>${req.applicant_name || 'अज्ञात निवेदक'}</b></td>
                <td><small>${req.type || 'निवेदन'}</small></td>
                <td><strong style="color:#2e7d32;">${req.esewa_code || req.paymentCode || 'हालिएको छैन'}</strong></td>
                <td>${statusBadge}</td>
                <td>
                    ${req.status !== 'APPROVED' ? `<button class="btn btn-approve" onclick="verifyPayment('${key}')">Verify & Approve</button>` : ''}
                    <button class="btn btn-delete" onclick="deleteRequest('${key}')">Delete</button>
                </td>
            `;
            tableBody.appendChild(row);
        });
    });

    function verifyPayment(key) {
        if(confirm("eSewa मा रकम प्राप्त भयो? स्वीकृत (Verify) गर्ने?")) {
            database.ref('requests/' + key).update({ 
                status: 'APPROVED',
                paymentStatus: 'Paid'
            });
        }
    }

    function deleteRequest(key) {
        if (confirm('के तपाईँ यो निवेदन हटाउन चाहनुहुन्छ?')) {
            database.ref('requests/' + key).remove();
        }
    }
</script>
</body>
</html>
