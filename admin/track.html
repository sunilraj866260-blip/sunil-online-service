<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>निवेदन ट्र्याक तथा प्रिन्ट</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="request.js"></script>
</head>
<body class="bg-slate-100 p-6 min-h-screen">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">निवेदन ट्र्याक तथा प्रिन्ट</h2>
        
        <div class="flex gap-2 mb-6">
            <input type="text" id="trackInput" placeholder="टोकन राख्नुहोस् (उदा: NIV-123456)" class="flex-1 border p-3 rounded-lg outline-sky-600">
            <button onclick="trackRequest()" class="bg-sky-600 text-white px-5 py-3 rounded-lg font-bold hover:bg-sky-700">खोज्नुहोस्</button>
        </div>

        <div id="result" class="hidden border-t pt-4 space-y-3">
            <p><strong>निवेदन प्रकार:</strong> <span id="resType"></span></p>
            <p><strong>दर्ता मिति:</strong> <span id="resDate"></span></p>
            <p><strong>भुक्तानी:</strong> <span id="resPayment"></span></p>
            <p><strong>अवस्था:</strong> <span id="resStatus" class="font-bold"></span></p>

            <div id="statusMessage" class="p-4 rounded-lg text-sm font-semibold"></div>

            <div id="printArea" class="hidden mt-4 pt-4 border-t">
                <button onclick="printApprovedDocument()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition shadow">
                    🖨️ मूल फाराममा A4 साइज प्रिन्ट / PDF डाउनलोड गर्नुहोस्
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentRequest = null;

        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');
        if(urlToken) {
            document.getElementById('trackInput').value = urlToken;
            trackRequest();
        }

        async function trackRequest() {
            const token = document.getElementById('trackInput').value.trim();
            currentRequest = await getRequestByToken(token);

            if (currentRequest) {
                document.getElementById('resType').innerText = currentRequest.type;
                document.getElementById('resDate').innerText = currentRequest.date || '-';
                document.getElementById('resPayment').innerText = currentRequest.paymentStatus;
                document.getElementById('resStatus').innerText = currentRequest.status;
                
                const statusMsg = document.getElementById('statusMessage');
                const printArea = document.getElementById('printArea');

                if (currentRequest.status === 'स्वीकृत (Approved)') {
                    statusMsg.className = "p-3 rounded-lg text-sm font-semibold bg-green-100 text-green-800";
                    statusMsg.innerText = "✓ तपाईंको निवेदन स्वीकृत भइसकेको छ। अब प्रिन्ट गर्न सक्नुहुन्छ।";
                    printArea.classList.remove('hidden');
                } else {
                    statusMsg.className = "p-3 rounded-lg text-sm font-semibold bg-yellow-100 text-yellow-800";
                    statusMsg.innerText = "⏳ तपाईंको निवेदन प्रक्रियामा छ। कार्यालयले Verify गरेपछि मात्र प्रिन्ट गर्न मिल्नेछ।";
                    printArea.classList.add('hidden');
                }

                document.getElementById('result').classList.remove('hidden');
            } else {
                alert('यो टोकन नम्बरको निवेदन फेला परेन।');
            }
        }

        function printApprovedDocument() {
            if (!currentRequest) return;
            const originalUrl = `${currentRequest.fileLink}?printToken=${currentRequest.token}`;
            window.open(originalUrl, '_blank');
        }
    </script>
</body>
</html>
