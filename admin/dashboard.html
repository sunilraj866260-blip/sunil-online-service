<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../css/admin.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../config/firebase-config.js"></script>
</head>
<body>

<div style="padding: 20px;">
    <h2>📊 एडमिन ड्यासबोर्ड (निवेदन व्यवस्थापन)</h2>
    <button onclick="logout()" style="float: right; background: red; color: white; padding: 5px 10px; border: none; border-radius: 4px;">लगआउट</button>
    <hr style="margin: 20px 0;">

    <table border="1" cellpadding="10" cellspacing="0" style="width: 100%; border-collapse: collapse; background: white;">
        <thead>
            <tr style="background: #2c3e50; color: white;">
                <th>ID</th>
                <th>प्रकार</th>
                <th>निवेदक</th>
                <th>सम्पर्क</th>
                <th>भुक्तानी</th>
                <th>अवस्था</th>
                <th>कार्य (Action)</th>
            </tr>
        </thead>
        <tbody id="adminTableBody">
            <!-- डाटा लोड हुनेछ -->
        </tbody>
    </table>
</div>

<script>
if(localStorage.getItem('adminLoggedIn') !== 'true') {
    window.location.href = 'login.html';
}

function logout() {
    localStorage.removeItem('adminLoggedIn');
    window.location.href = 'login.html';
}

function loadNivedans() {
    db.ref('nivedans').on('value', snapshot => {
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = '';
        snapshot.forEach(child => {
            const key = child.key;
            const val = child.val();
            
            let row = `<tr>
                <td>${key}</td>
                <td>${val.formType}</td>
                <td>${val.applicantName}</td>
                <td>${val.mobileNumber || '-'}</td>
                <td>${val.paymentType || 'Unpaid'}</td>
                <td><b>${val.status || 'Pending'}</b></td>
                <td>
                    <button onclick="updateStatus('${key}', 'Approved')" style="background: green; color: white; border:none; padding: 5px;">स्वीकृत</button>
                    <button onclick="updateStatus('${key}', 'Rejected')" style="background: red; color: white; border:none; padding: 5px;">अस्वीकृत</button>
                </td>
            </tr>`;
            tbody.innerHTML += row;
        });
    });
}

function updateStatus(id, status) {
    db.ref('nivedans/' + id).update({
        status: status
    }).then(() => alert('अवस्था अद्यावधिक भयो: ' + status));
}

loadNivedans();
</script>
</body>
</html>
