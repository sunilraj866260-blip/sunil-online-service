<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन ड्यासबोर्ड</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 20px; }
        .header { background: #b71515; color: white; padding: 15px 20px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .header a { color: white; text-decoration: none; font-weight: bold; margin-left: 15px; }
        .container { background: white; padding: 20px; border-radius: 6px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #333; color: white; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-approve { background: #27ae60; color: white; }
        .btn-print { background: #2980b9; color: white; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>

<div class="header">
    <h2>वडा एडमिन ड्यासबोर्ड</h2>
    <div>
        <a href="pending.html">पेन्डिङ निवेदनहरू</a>
        <a href="#" onclick="logout()">लगआउट</a>
    </div>
</div>

<div class="container">
    <h3>सबै निवेदनहरू र eSewa Verification</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>निवेदक</th>
                <th>सेवा</th>
                <th>eSewa Txn ID</th>
                <th>फोन नं.</th>
                <th>अवस्था</th>
                <th>कार्य</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    if (sessionStorage.getItem("adminLoggedIn") !== "true") window.location.href = "login.html";

    const firebaseConfig = {
        apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
        databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref("applications").on("value", (snapshot) => {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (!snapshot.exists()) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">कुनै डाटा भेटिएन।</td></tr>';
            return;
        }

        snapshot.forEach((childSnap) => {
            const d = childSnap.val();
            const id = childSnap.key;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${id}</b></td>
                <td>${d.fullName}</td>
                <td>${d.serviceType}</td>
                <td><strong style="color:#27ae60;">${d.esewaTxnId}</strong></td>
                <td>${d.mobile}</td>
                <td><b>${d.status}</b></td>
                <td>
                    ${d.status !== 'Approved' 
                        ? `<button class="btn btn-approve" onclick="approve('${id}')">Verify & Approve</button>` 
                        : `<a href="print.html?id=${id}" class="btn btn-print" target="_blank">प्रिन्ट</a>`
                    }
                </td>
            `;
            tbody.appendChild(tr);
        });
    });

    function approve(id) {
        if(confirm("eSewa रकम प्राप्त भयो? स्वीकृत गर्ने?")) {
            db.ref("applications/" + id).update({ status: 'Approved' });
        }
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = "login.html";
    }
</script>
</body>
</html>
