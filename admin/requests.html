<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन भेरिफिकेसन ड्यासबोर्ड</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../request/request.js"></script>
</head>
<body class="bg-slate-100 p-6 min-h-screen">
    <div class="container mx-auto bg-white p-6 rounded-2xl shadow-lg">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 class="text-2xl font-bold text-slate-800">निवेदन तथा भुक्तानी भेरिफिकेसन (Admin)</h2>
            <a href="../index.html" class="text-sky-600 font-bold hover:underline text-sm">← होमपेज</a>
        </div>
        
        <div class="overflow-x-auto">
            <table class="w-full border-collapse border border-slate-200">
                <thead>
                    <tr class="bg-slate-50 text-left text-xs uppercase tracking-wider text-slate-600">
                        <th class="p-3 border">टोकन</th>
                        <th class="p-3 border">प्रकार</th>
                        <th class="p-3 border">निवेदन विवरण</th>
                        <th class="p-3 border">eSewa / Khalti Ref ID</th>
                        <th class="p-3 border">अवस्था</th>
                        <th class="p-3 border">कारबाही (Action)</th>
                    </tr>
                </thead>
                <tbody id="requestTableBody">
                    <tr><td colspan="6" class="p-4 text-center text-slate-400">डाटा लोड हुँदैछ...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // रियलटाइम डाटा सुन्ने (Firebase Streaming)
        function listenRealtimeData() {
            const eventSource = new EventSource(`${API_BASE_URL}/requests.json`);
            eventSource.onmessage = function(event) {
                renderTable(JSON.parse(event.data));
            };
        }

        function renderTable(requestsObj) {
            const tbody = document.getElementById('requestTableBody');
            tbody.innerHTML = '';
            if (!requestsObj) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500">कुनै निवेदन फेला परेन।</td></tr>`;
                return;
            }

            const requestsList = Object.keys(requestsObj).map(key => requestsObj[key]);
            requestsList.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            requestsList.forEach((req) => {
                let formattedData = '';
                if(req.data) {
                    for (let k in req.data) { formattedData += `<b>${k}:</b> ${req.data[k]}<br>`; }
                }

                const isApproved = req.status === 'स्वीकृत (Approved)';

                const row = `
                    <tr class="border-b hover:bg-slate-50 text-sm">
                        <td class="p-3 border font-mono font-bold text-sky-600">${req.token}</td>
                        <td class="p-3 border font-semibold">${req.type}</td>
                        <td class="p-3 border text-xs">${formattedData}</td>
                        <td class="p-3 border font-mono font-bold text-amber-700 bg-amber-50">${req.paymentCode || 'हालिएको छैन'}</td>
                        <td class="p-3 border">
                            <span class="px-2 py-1 rounded text-xs font-bold ${isApproved ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                                ${req.status}
                            </span>
                        </td>
                        <td class="p-3 border space-y-1">
                            <button onclick="changeStatus('${req.token}', 'स्वीकृत (Approved)')" class="w-full bg-green-600 text-white px-2 py-1.5 text-xs rounded font-bold hover:bg-green-700 shadow">
                                ✓ Verify & Approve (प्रिन्ट खोल्नुहोस्)
                            </button>
                            <button onclick="changeStatus('${req.token}', 'अस्वीकृत (Rejected)')" class="w-full bg-red-500 text-white px-2 py-1 text-xs rounded hover:bg-red-600">
                                ✕ अस्वीकृत
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        async function changeStatus(token, newStatus) {
            await updateRequestField(token, { status: newStatus });
            alert(`टोकन ${token} को अवस्था अपडेट भयो!`);
        }

        listenRealtimeData();
    </script>
</body>
</html>
