<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन भेरिफिकेसन ड्यासबोर्ड</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../request/request.js"></script>
</head>
<body class="bg-slate-100 p-4 sm:p-6 min-h-screen">
    <div class="container mx-auto bg-white p-4 sm:p-6 rounded-2xl shadow-lg">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 class="text-xl sm:text-2xl font-bold text-slate-800">निवेदन तथा भुक्तानी भेरिफिकेसन (Admin)</h2>
            <button onclick="loadAllRequests()" class="bg-sky-600 hover:bg-sky-700 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow transition">
                🔄 रिफ्रेस गर्नुहोस्
            </button>
        </div>
        
        <div class="overflow-x-auto">
            <table class="w-full border-collapse border border-slate-200">
                <thead>
                    <tr class="bg-slate-50 text-left text-xs uppercase tracking-wider text-slate-600">
                        <th class="p-3 border">टोकन</th>
                        <th class="p-3 border">प्रकार</th>
                        <th class="p-3 border">निवेदन विवरण</th>
                        <th class="p-3 border">eSewa / Khalti Ref ID</th>
                        <th class="p-3 border">अवस्था</th>
                        <th class="p-3 border">कारबाही (Action)</th>
                    </tr>
                </thead>
                <tbody id="requestTableBody">
                    <tr><td colspan="6" class="p-4 text-center text-slate-400 font-semibold">डाटा खोज्दैछ...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // डाटा तान्ने र टेबलमा देखाउने फङ्क्सन
        async function loadAllRequests() {
            const tbody = document.getElementById('requestTableBody');
            let requestsList = [];

            // १. Firebase बाट डाटा तान्न खोज्ने
            try {
                const res = await fetch(`${API_BASE_URL}/requests.json?key=${firebaseConfig.apiKey}`);
                if (res.ok) {
                    const cloudData = await res.json();
                    if (cloudData) {
                        requestsList = Object.keys(cloudData).map(key => cloudData[key]);
                    }
                }
            } catch (err) {
                console.warn("Firebase Fetch Error, switching to LocalStorage:", err);
            }

            // २. यदि Firebase खाली वा Error छ भने Local Storage को डाटा तान्ने
            if (requestsList.length === 0) {
                requestsList = JSON.parse(localStorage.getItem('nivedan_requests')) || [];
            }

            // ३. डाटा छैन भने म्यासेज देखाउने
            if (requestsList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-red-500 font-bold">कुनै पनि निवेदन फेला परेन। फाराम भरेर सबमिट गरी हेर्नुहोस्।</td></tr>`;
                return;
            }

            // नयाँ निवेदनहरूलाई माथि राख्ने (Sort)
            requestsList.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            // ४. टेबलमा डाटा भर्ने
            tbody.innerHTML = '';
            requestsList.forEach((req) => {
                let formattedData = '';
                if (req.data) {
                    for (let k in req.data) {
                        formattedData += `<b class="text-slate-700">${k}:</b> ${req.data[k]}<br>`;
                    }
                }

                const isApproved = req.status === 'स्वीकृत (Approved)';

                const row = `
                    <tr class="border-b hover:bg-slate-50 text-sm">
                        <td class="p-3 border font-mono font-bold text-sky-600">${req.token}</td>
                        <td class="p-3 border font-semibold">${req.type || 'निवेदन'}</td>
                        <td class="p-3 border text-xs max-w-xs overflow-hidden">${formattedData || 'विवरण खाली'}</td>
                        <td class="p-3 border font-mono font-bold text-amber-700 bg-amber-50 text-center">${req.paymentCode || 'हालिएको छैन'}</td>
                        <td class="p-3 border">
                            <span class="px-2 py-1 rounded text-xs font-bold ${isApproved ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                                ${req.status}
                            </span>
                        </td>
                        <td class="p-3 border space-y-1">
                            <button onclick="handleStatusChange('${req.token}', 'स्वीकृत (Approved)')" class="w-full bg-green-600 text-white px-2 py-1.5 text-xs rounded font-bold hover:bg-green-700 shadow transition">
                                ✓ Verify & Approve (प्रिन्ट खोल्नुहोस्)
                            </button>
                            <button onclick="handleStatusChange('${req.token}', 'अस्वीकृत (Rejected)')" class="w-full bg-red-500 text-white px-2 py-1 text-xs rounded hover:bg-red-600 transition">
                                ✕ अस्वीकृत
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        async function handleStatusChange(token, status) {
            await updateRequestField(token, { status: status });
            alert(`टोकन ${token} को अवस्था "${status}" मा अपडेट भयो!`);
            loadAllRequests(); // टेबल रिफ्रेस गर्ने
        }

        // पेज खुल्ने बित्तिकै डाटा लोड गर्ने
        document.addEventListener('DOMContentLoaded', () => {
            loadAllRequests();
            // प्रत्येक ५ सेकेन्डमा स्वतः नयाँ डाटा चेक गर्ने
            setInterval(loadAllRequests, 5000);
        });
    </script>
</body>
</html>
