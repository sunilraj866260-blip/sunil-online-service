<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>डिजिटल निवेदन प्रणाली - रोहिणी-१</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --primary: #1e3799; --secondary: #27ae60; --danger: #c0392b; }
        body { font-family: 'Arial', sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ccc; padding-bottom: 10px; flex-wrap: wrap; }
        nav button { padding: 10px 15px; border: none; background: var(--primary); color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
        nav button:hover { background: #0c2461; }
        .tab-content { display: none; }
        .active { display: block; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        .row { display: flex; gap: 15px; }
        .row .input-group { flex: 1; }
        .section-title { background: #e8ecef; padding: 10px; margin: 20px 0 10px 0; font-weight: bold; border-left: 6px solid var(--primary); }
        
        .btn-add { background: var(--primary); color: white; padding: 8px 15px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 15px; }
        .btn-danger { background: var(--danger); color: white; padding: 5px 10px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; }
        .child-box { border: 1px dashed var(--primary); padding: 15px; margin-bottom: 15px; background: #f9fbfd; border-radius: 6px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table, th, td { border: 1px solid #000; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }

        /* Print Styles */
        .print-container { position: relative; border: 1px solid #333; padding: 30px; background: #fff; margin-top: 20px; line-height: 1.8; font-size: 14pt; }
        .watermark { position: absolute; top: 35%; left: 20%; font-size: 60px; color: rgba(231, 76, 60, 0.25); transform: rotate(-30deg); font-weight: bold; pointer-events: none; border: 4px solid rgba(231, 76, 60, 0.25); padding: 10px 20px; }
        
        @media print {
            body * { visibility: hidden; }
            .print-container, .print-container * { visibility: visible; }
            .print-container { position: absolute; left: 0; top: 0; width: 100%; border: none; padding: 0; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body onload="setInitialDate()">

<div class="container">
    <div style="text-align: center; margin-bottom: 20px;">
        <h2 style="color:var(--primary); margin-bottom:5px;">वडा सिफारिस प्रणाली (रोहिणी-१)</h2>
    </div>

    <!-- MAIN NAVIGATION -->
    <nav class="no-print">
        <button onclick="showTab('forms-tab')">📝 निवेदन फारम</button>
        <button onclick="showTab('trace-tab')">🔍 TRACE (खोज्नुहोस्)</button>
        <button onclick="showTab('admin-tab')">👨‍💼 Admin Dashboard</button>
    </nav>

    <!-- FORMS TAB -->
    <div id="forms-tab" class="tab-content active no-print">
        <form id="nivedanForm">
            <div class="input-group">
                <label>सिफारिसको प्रकार छान्नुहोस्:</label>
                <select id="formType" onchange="renderDynamicFields()">
                    <option value="जन्म दर्ता">जन्म दर्ता गरिपाऊँ।</option>
                    <option value="विवाह दर्ता">विवाह दर्ता गरिपाऊँ।</option>
                </select>
            </div>

            <div class="row">
                <div class="input-group"><label>मिति (वि.सं.):</label><input type="text" id="in_today"></div>
                <div class="input-group"><label>फोन नं.:</label><input type="text" id="in_phone" value="9824479375"></div>
            </div>

            <div id="dynamicFormFields">
                <!-- Dynamically Loaded Fields -->
            </div>

            <button type="submit" style="width:100%; padding:15px; background:var(--secondary); color:white; font-size:18px; font-weight:bold; border:none; border-radius:6px; cursor:pointer;">निवेदन सेभ गर्नुहोस् (Save Application)</button>
        </form>
    </div>

    <!-- TRACE TAB -->
    <div id="trace-tab" class="tab-content no-print">
        <h3>निवेदन ट्र्याकिङ</h3>
        <div style="display:flex; gap:10px;">
            <input type="text" id="traceSearchInput" placeholder="फोन नम्बर वा ID राख्नुहोस्">
            <button onclick="traceApplication()" style="background:var(--primary); color:white; padding:10px; border:none; border-radius:4px; cursor:pointer;">खोज्नुहोस्</button>
        </div>
        <div id="traceResult"></div>
    </div>

    <!-- ADMIN TAB -->
    <div id="admin-tab" class="tab-content no-print">
        <h3>Admin Dashboard</h3>
        <table>
            <thead>
                <tr><th>ID</th><th>प्रकार</th><th>नाम</th><th>मोबाइल</th><th>स्थिति</th><th>कार्य</th></tr>
            </thead>
            <tbody id="adminTableBody"></tbody>
        </table>
    </div>

    <!-- PRINT VIEW -->
    <div id="printView" style="display:none;">
        <hr class="no-print" style="margin: 30px 0;">
        <div class="print-container" id="printableArea">
            <div id="watermarkOverlay" class="watermark" style="display:none;">FREE COPY</div>
            <div style="text-align: right;">मिति: <span id="p_today"></span></div>
            <div>
                श्रीमान् वडा अध्यक्ष ज्यू,<br>
                रोहिणी गाउँपालिका, वडा नं. १,<br>
                रुपन्देही, नेपाल।
            </div>
            <div style="text-align:center; font-weight:bold; text-decoration:underline; margin:20px 0; font-size:16pt;">
                विषय: <span id="p_subject"></span>
            </div>
            <p>महोदय,</p>
            <div id="p_content" style="text-indent: 50px; text-align:justify;"></div>
            
            <div id="p_children_table_wrapper" style="margin: 15px 0;"></div>

            <div style="display: flex; justify-content: space-between; margin-top: 30px;">
                <div style="width: 55%; font-size:12pt;" id="p_attachment"></div>
                <div style="width: 40%;">
                    <strong>निवेदक:</strong><br><br>
                    सही: ...........................<br>
                    नाम: <strong id="p_name">………………</strong><br>
                    ठेगाना: रोहिणी-१, रुपन्देही<br>
                    फोन: <span id="p_phone">98244</span>
                </div>
            </div>
        </div>
        <div class="no-print" style="margin-top: 15px; display:flex; gap:10px;">
            <button onclick="window.print()" style="background:var(--secondary); color:white; padding:10px 20px; font-weight:bold; cursor:pointer; border:none; border-radius:4px;">🖨️ A4 साइजमा प्रिन्ट गर्नुहोस्</button>
            <button onclick="closePrintView()" style="background:var(--danger); color:white; padding:10px 20px; cursor:pointer; border:none; border-radius:4px;">X Close</button>
        </div>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
        authDomain: "sunil-online-service.firebaseapp.com",
        databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com",
        projectId: "sunil-online-service",
        storageBucket: "sunil-online-service.appspot.com",
        messagingSenderId: "",
        appId: ""
    };

    let db = null;
    let allNivedansData = {};
    let childCount = 1;

    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        db.ref('nivedans').on('value', (snapshot) => {
            allNivedansData = snapshot.val() || {};
            loadAdminDashboard();
        });
    } catch(e) { console.error(e); }

    function setInitialDate() {
        try {
            const options = { year: 'numeric', month: 'numeric', day: 'numeric', calendar: 'nepali' };
            document.getElementById('in_today').value = new Intl.DateTimeFormat('ne-NP-u-ca-nepali', options).format(new Date());
        } catch (e) { document.getElementById('in_today').value = "२०८३/०६/२९"; }
        renderDynamicFields();
    }

    function showTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
    }

    function renderDynamicFields() {
        const type = document.getElementById('formType').value;
        const container = document.getElementById('dynamicFormFields');
        container.innerHTML = '';

        if(type === 'जन्म दर्ता') {
            container.innerHTML = `
                <div class="section-title">मुख्य विवरण</div>
                <div class="row">
                    <div class="input-group">
                        <label>निवेदक बच्चाको को हुनुहुन्छ ?</label>
                        <select id="in_applicant_role">
                            <option value="बुवा">बुवा (पिता)</option>
                            <option value="आमा">आमा (माता)</option>
                        </select>
                    </div>
                    <div class="input-group"><label>निवेदकको नाम:</label><input type="text" id="in_name" required></div>
                </div>

                <div class="row">
                    <div class="input-group"><label>बच्चाको बुवाको नाम:</label><input type="text" id="in_father" required></div>
                    <div class="input-group"><label>बाजेको नाम:</label><input type="text" id="in_grandpa" required></div>
                </div>
                
                <div class="row">
                    <div class="input-group">
                        <label>निवेदक (बाजेको के हो?):</label>
                        <select id="in_grandpa_rel">
                            <option value="नाति">नाति</option>
                            <option value="नातिनी">नातिनी</option>
                            <option value="बुहारी">बुहारी</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>निवेदक (बुवाको के हो?):</label>
                        <select id="in_father_rel">
                            <option value="छोरा">छोरा</option>
                            <option value="छोरी">छोरी</option>
                            <option value="श्रीमती">श्रीमती</option>
                        </select>
                    </div>
                </div>
                
                <div class="row">
                    <div class="input-group"><label>माता-पिताको विवाह भएको मिति:</label><input type="text" id="in_marriage_date" placeholder="२०७८/१०/१२" required></div>
                </div>

                <div class="section-title">बच्चा(हरू)को विवरण</div>
                <div id="children_container">
                    <div class="child-box" id="child_block_1">
                        <div class="row">
                            <div class="input-group"><label>बच्चाको नाम:</label><input type="text" class="child-name" required></div>
                            <div class="input-group">
                                <label>बच्चाको लिङ्ग:</label>
                                <select class="child-gender">
                                    <option value="छोरा">छोरा</option>
                                    <option value="छोरी">छोरी</option>
                                </select>
                            </div>
                            <div class="input-group"><label>जन्म मिति:</label><input type="text" class="child-dob" required></div>
                        </div>
                        <div class="row">
                            <div class="input-group"><label>जन्मस्थान:</label><input type="text" class="child-birthplace" placeholder="रोहिणी-१, रुपन्देही"></div>
                            <div class="input-group"><label>टोकन नम्बर:</label><input type="text" class="child-token" placeholder="टोकन नं."></div>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn-add" onclick="addChildBox()">+ थप बच्चा थप्नुहोस् (Add Child)</button>
            `;
        } else {
            container.innerHTML = `<div class="input-group"><label>विवरण:</label><textarea id="in_details"></textarea></div>`;
        }
    }

    function addChildBox() {
        childCount++;
        const container = document.getElementById('children_container');
        const html = `
            <div class="child-box" id="child_block_${childCount}">
                <div class="row">
                    <div class="input-group"><label>बच्चाको नाम:</label><input type="text" class="child-name"></div>
                    <div class="input-group">
                        <label>बच्चाको लिङ्ग:</label>
                        <select class="child-gender"><option value="छोरा">छोरा</option><option value="छोरी">छोरी</option></select>
                    </div>
                    <div class="input-group"><label>जन्म मिति:</label><input type="text" class="child-dob"></div>
                </div>
                <div class="row">
                    <div class="input-group"><label>जन्मस्थान:</label><input type="text" class="child-birthplace" placeholder="रोहिणी-१, रुपन्देही"></div>
                    <div class="input-group"><label>टोकन नम्बर:</label><input type="text" class="child-token" placeholder="टोकन नं."></div>
                </div>
                <button type="button" class="btn-danger" onclick="document.getElementById('child_block_${childCount}').remove()">यो हटाउनुहोस्</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
    }

    // FORM SUBMIT
    document.getElementById('nivedanForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = 'NIV-' + Date.now();
        const formType = document.getElementById('formType').value;

        // Collect Children Data if Janma
        let children = [];
        if(formType === 'जन्म दर्ता') {
            const names = document.querySelectorAll('.child-name');
            const genders = document.querySelectorAll('.child-gender');
            const dobs = document.querySelectorAll('.child-dob');
            const birthplaces = document.querySelectorAll('.child-birthplace');
            const tokens = document.querySelectorAll('.child-token');

            for (let i = 0; i < names.length; i++) {
                children.push({
                    name: names[i].value,
                    gender: genders[i].value,
                    dob: dobs[i].value,
                    birthplace: birthplaces[i].value,
                    token: tokens[i].value
                });
            }
        }

        const data = {
            id: id,
            formType: formType,
            applicantName: document.getElementById('in_name') ? document.getElementById('in_name').value : '',
            mobileNumber: document.getElementById('in_phone').value,
            date: document.getElementById('in_today').value,
            fatherName: document.getElementById('in_father') ? document.getElementById('in_father').value : '',
            grandpaName: document.getElementById('in_grandpa') ? document.getElementById('in_grandpa').value : '',
            grandpaRel: document.getElementById('in_grandpa_rel') ? document.getElementById('in_grandpa_rel').value : '',
            fatherRel: document.getElementById('in_father_rel') ? document.getElementById('in_father_rel').value : '',
            marriageDate: document.getElementById('in_marriage_date') ? document.getElementById('in_marriage_date').value : '',
            children: children,
            status: 'Pending',
            paymentType: 'FREE'
        };

        if(db) {
            db.ref('nivedans/' + id).set(data, (err) => {
                if(!err) {
                    alert('निवेदन सफलतापुर्वक दर्ता भयो! ID: ' + id);
                    showTab('trace-tab');
                    document.getElementById('traceSearchInput').value = data.mobileNumber;
                    traceApplication();
                }
            });
        }
    });

    // TRACE
    function traceApplication() {
        const query = document.getElementById('traceSearchInput').value.trim();
        const container = document.getElementById('traceResult');
        container.innerHTML = '';

        const results = Object.values(allNivedansData).filter(item => 
            item.mobileNumber === query || item.id === query
        );

        results.forEach(item => {
            const div = document.createElement('div');
            div.style.cssText = "border:1px solid #ccc; padding:10px; margin-top:10px;";
            div.innerHTML = `
                <h4>${item.formType} (${item.id})</h4>
                <p>आवेदक: ${item.applicantName} | फोन: ${item.mobileNumber}</p>
                <button onclick="openPrintModal('${item.id}')" style="background:var(--primary); color:white; padding:5px 10px; border:none; cursor:pointer;">प्रिन्ट हेर्नुहोस्</button>
            `;
            container.appendChild(div);
        });
    }

    // ADMIN
    function loadAdminDashboard() {
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = '';
        Object.values(allNivedansData).forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.id}</td><td>${item.formType}</td><td>${item.applicantName}</td><td>${item.mobileNumber}</td>
                <td><b>${item.status}</b></td>
                <td><button onclick="openPrintModal('${item.id}')">View</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // PRINT MODAL
    function openPrintModal(id) {
        const item = allNivedansData[id];
        if(!item) return;

        document.getElementById('p_today').innerText = item.date;
        document.getElementById('p_subject').innerText = item.formType + " गरिपाऊँ।";
        document.getElementById('p_name').innerText = item.applicantName;
        document.getElementById('p_phone').innerText = item.mobileNumber;

        let con = `उपरोक्त सम्बन्धमा म निवेदक यस रोहिणी गाउँपालिका वडा नं. १ मा बसोबास गर्ने <strong>${item.grandpaName}</strong> को ${item.grandpaRel}, तथा श्री <strong>${item.fatherName}</strong> को ${item.fatherRel} <strong>${item.applicantName}</strong> हूँ। मिति <strong>${item.marriageDate}</strong> मा सामाजिक परम्परा अनुसार विवाह भई बसोबास गर्दै आएकोमा तपसिल बमोजिमका हाम्रो बच्चाहरूको जन्म भएको हुदा जन्म दर्ता प्रमाणपत्र बनाउनको लागि यो निवेदन पेश गरेको छु।`;
        document.getElementById('p_content').innerHTML = con;

        // Table
        if(item.children && item.children.length > 0) {
            let table = `<table><thead><tr><th>क्र.सं.</th><th>बच्चाको नाम</th><th>लिङ्ग</th><th>जन्म मिति</th><th>जन्मस्थान</th><th>टोकन नं.</th></tr></thead><tbody>`;
            item.children.forEach((c, idx) => {
                table += `<tr><td>${idx+1}</td><td><b>${c.name}</b></td><td>${c.gender}</td><td>${c.dob}</td><td>${c.birthplace}</td><td><b>${c.token}</b></td></tr>`;
            });
            table += `</tbody></table>`;
            document.getElementById('p_children_table_wrapper').innerHTML = table;
        }

        document.getElementById('p_attachment').innerHTML = `<strong>संलग्न कागजातहरू:</strong><br>१. बाबु-आमाको नागरिकता प्रतिलिपि<br>२. अस्पतालको जन्म डिस्चार्ज पुर्जी/जन्म दर्ता प्रतिलिपि<br>३. विवाह दर्ता प्रमाणपत्रको प्रतिलिपि`;

        document.getElementById('printView').style.display = 'block';
        window.scrollTo(0, document.getElementById('printView').offsetTop);
    }

    function closePrintView() {
        document.getElementById('printView').style.display = 'none';
    }
</script>
</body>
</html>
