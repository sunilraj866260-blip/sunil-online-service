<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <title>नेपाली नागरिकता सिफारिस फारम - रोहिणी वडा नं. १</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f1f2f6; padding: 20px; margin: 0; }
        .master-card { max-width: 850px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-bottom: 30px; }
        h2 { text-align: center; color: #b71515; border-bottom: 3px solid #b71515; padding-bottom: 10px; margin-top: 0; }
        .section-title { background: #e9ecef; padding: 10px; margin: 20px 0 10px 0; font-weight: bold; border-left: 6px solid #b71515; color: #2d3436; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        .row { display: flex; gap: 15px; margin-bottom: 10px; }
        .row div { flex: 1; }
        .esewa-box { background: #e8f8f5; border: 1px dashed #27ae60; padding: 15px; margin-top: 15px; border-radius: 6px; }
        button { width: 100%; padding: 18px; background: #b71515; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 20px; font-weight: bold; margin-top: 20px; }
        button:hover { background: #8e1010; }
        button:disabled { background: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body onload="initDate()">

<div class="master-card">
    <a href="../index.html" style="color:#b71515; text-decoration:none; font-weight:bold;">← गृहपृष्ठ</a>
    <h2>नेपाली नागरिकता सिफारिस निवेदन फारम (रोहिणी वडा नं. १)</h2>
    
    <form id="nagarikataForm">
        <div class="row">
            <div class="input-group">
                <label>आजको मिति (वि.सं.): *</label>
                <input type="text" id="in_date" required>
            </div>
            <div class="input-group">
                <label>निवेदकको नाम थर (नागरिकता लिने व्यक्ति): *</label>
                <input type="text" id="cz_app_name" placeholder="नागरिकता लिनेको नाम" required>
            </div>
        </div>

        <div class="section-title">१. ठेगाना र पारिवारिक विवरण</div>
        <div class="row">
            <div><label>जिल्ला : *</label><input type="text" id="cz_district" value="रुपन्देही" required></div>
            <div><label>गाउँपालिका / नगरपालिका : *</label><input type="text" id="cz_local_body" value="रोहिणी गाउँपालिका" required></div>
        </div>
        <div class="row">
            <div><label>वडा नं. : *</label><input type="text" id="cz_ward_no" value="१" required></div>
            <div><label>टोलको नाम : *</label><input type="text" id="cz_toll" placeholder="उदा: पिप्रहवा / धखई" required></div>
        </div>
        
        <div class="row">
            <div><label>बाजेको नाम थर : *</label><input type="text" id="cz_grand_name" placeholder="बाजेको नाम" required></div>
            <div>
                <label>नाता छान्नुहोस् (बाजे तर्फको) : *</label>
                <select id="cz_grand_relation">
                    <option value="नाति">नाति</option>
                    <option value="नातिनी">नातिनी</option>
                    <option value="बुहारी">बुहारी</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div><label>बाबुको नाम थर : *</label><input type="text" id="cz_father_name" placeholder="बाबुको नाम" required></div>
            <div>
                <label>नाता छान्नुहोस् (बाबु तर्फको) : *</label>
                <select id="cz_parent_relation">
                    <option value="छोरा">छोरा</option>
                    <option value="छोरी">छोरी</option>
                    <option value="पत्नी">पत्नी</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div><label>पति वा पत्नीको नाम थर (विवाहितको हकमा) :</label><input type="text" id="cz_spouse_name" placeholder="नभए खाली छोड्नुहोस्"></div>
            <div>
                <label>नाता (पति/पत्नी छान्नुहोस्) :</label>
                <select id="cz_spouse_relation">
                    <option value="">-- छान्नुहोस् --</option>
                    <option value="पति">पति</option>
                    <option value="पत्नी">पत्नी</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div><label>जन्म मिति (वि.सं.) : *</label><input type="text" id="cz_dob" placeholder="२०--/--/--" required></div>
            <div><label>सम्पर्क फोन नं.: *</label><input type="tel" id="mobile" placeholder="उदा: 98XXXXXXXX" required></div>
        </div>

        <div class="section-title">२. संलग्न कागजातहरू</div>
        <div class="row">
            <div><label>१. बाबु आमाको ना.प्र.प. प्रतिलिपि (थान) :</label><input type="text" id="doc_1" value="१"></div>
            <div><label>२. जन्म दर्ता प्रमाण-पत्रको प्रतिलिपि (थान) :</label><input type="text" id="doc_2" value="१"></div>
        </div>
        <div class="row">
            <div><label>३. शैक्षिक प्रमाण-पत्रको प्रतिलिपि (थान) :</label><input type="text" id="doc_3" placeholder="०"></div>
            <div><label>४. सनाखत व्यक्तिको ना.प्र.प. प्रतिलिपि :</label><input type="text" id="doc_4" value="१"></div>
        </div>
        <div class="row">
            <div><label>५. विवाह दर्ता प्रमाणपत्रको प्रतिलिपि (थान) :</label><input type="text" id="doc_5" placeholder="०"></div>
            <div><label>६. अन्य कागजात (थान) :</label><input type="text" id="doc_6" placeholder="०"></div>
        </div>

        <div class="section-title">३. सनाखत गर्ने व्यक्तिको विवरण</div>
        <div class="row">
            <div><label>सनाखत बस्नेको नाम थर : *</label><input type="text" id="s_name" placeholder="उदा: राम बहादुर भर" required></div>
            <div>
                <label>नाता (निवेदकका) : *</label>
                <select id="s_rel">
                    <option value="पिता">पिता</option>
                    <option value="काका">काका</option>
                    <option value="दाजु">दाजु</option>
                    <option value="आमा">आमा</option>
                    <option value="दिदी">दिदी</option>
                    <option value="बहिनी">बहिनी</option>
                    <option value="संरक्षक">संरक्षक</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div><label>सनाखत बस्नेको ठेगाना वडा नं. : *</label><input type="text" id="s_ward" value="१" required></div>
            <div><label>नागरिकता प्रमाणपत्र नं. : *</label><input type="text" id="s_cit_no" required></div>
        </div>
        <div class="row">
            <div><label>नागरिकता जारी जिल्ला : *</label><input type="text" id="s_cit_dist" value="रुपन्देही" required></div>
            <div><label>उमेर (वर्ष) : *</label><input type="text" id="s_age" placeholder="उदा: ४५" required></div>
        </div>

        <div class="esewa-box">
            <label style="margin-top:0; color:#27ae60;">eSewa Payment Code (Txn ID): *</label>
            <input type="text" id="esewaTxnId" placeholder="उदा: 8X92K1L" required>
        </div>

        <button type="submit" id="btnSubmit">निवेदन पेश गर्नुहोस्</button>
    </form>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
        databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function initDate() {
        try {
            const options = { year: 'numeric', month: 'numeric', day: 'numeric', calendar: 'nepali' };
            document.getElementById('in_date').value = new Intl.DateTimeFormat('ne-NP-u-ca-nepali', options).format(new Date());
        } catch (e) {
            document.getElementById('in_date').value = "२०८३/--/--";
        }
    }

    document.getElementById('nagarikataForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = "पेश हुँदैछ...";

        const subId = "NIV-" + Math.floor(10000 + Math.random() * 90000);
        
        const data = {
            submissionId: subId,
            serviceType: "नेपाली नागरिकता सिफारिस",
            date: document.getElementById('in_date').value.trim(),
            fullName: document.getElementById('cz_app_name').value.trim(),
            district: document.getElementById('cz_district').value.trim(),
            localBody: document.getElementById('cz_local_body').value.trim(),
            wardNo: document.getElementById('cz_ward_no').value.trim(),
            toll: document.getElementById('cz_toll').value.trim(),
            grandFatherName: document.getElementById('cz_grand_name').value.trim(),
            grandRelation: document.getElementById('cz_grand_relation').value,
            fatherName: document.getElementById('cz_father_name').value.trim(),
            parentRelation: document.getElementById('cz_parent_relation').value,
            spouseName: document.getElementById('cz_spouse_name').value.trim(),
            spouseRelation: document.getElementById('cz_spouse_relation').value,
            dob: document.getElementById('cz_dob').value.trim(),
            mobile: document.getElementById('mobile').value.trim(),
            doc_1: document.getElementById('doc_1').value.trim(),
            doc_2: document.getElementById('doc_2').value.trim(),
            doc_3: document.getElementById('doc_3').value.trim(),
            doc_4: document.getElementById('doc_4').value.trim(),
            doc_5: document.getElementById('doc_5').value.trim(),
            doc_6: document.getElementById('doc_6').value.trim(),
            sanaakhatName: document.getElementById('s_name').value.trim(),
            sanaakhatRelation: document.getElementById('s_rel').value,
            sanaakhatWard: document.getElementById('s_ward').value.trim(),
            sanaakhatCitNo: document.getElementById('s_cit_no').value.trim(),
            sanaakhatCitDistrict: document.getElementById('s_cit_dist').value.trim(),
            sanaakhatAge: document.getElementById('s_age').value.trim(),
            esewaTxnId: document.getElementById('esewaTxnId').value.trim(),
            status: "Pending", // सुरुमा पेन्डिङ रहनेछ
            createdDate: new Date().toISOString()
        };

        try {
            await db.ref("applications/" + subId).set(data);
            // स्टेटस हेर्ने र प्रिन्ट गर्ने पानामा पठाउने
            window.location.href = "../customer/submit.html?id=" + subId;
        } catch (err) {
            alert("त्रुटि आयो: " + err.message);
            btn.disabled = false;
            btn.innerText = "निवेदन पेश गर्नुहोस्";
        }
    });
</script>

</body>
</html>
