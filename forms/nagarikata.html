<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नागरिकता सिफारिश फारम</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; }
        .form-box { max-width: 600px; background: white; margin: auto; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #b71515; text-align: center; margin-top: 0; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .esewa-box { background: #e8f8f5; border: 1px dashed #27ae60; padding: 12px; margin-top: 15px; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #b71515; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 4px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="form-box">
    <a href="../index.html" style="color:#b71515; text-decoration:none;">← गृहपृष्ठ</a>
    <h2>नेपाली नागरिकता सिफारिश फारम</h2>

    <form id="nagarikataForm">
        <label>निवेदकको पूरा नाम: *</label>
        <input type="text" id="fullName" required>

        <label>बाबुको नाम: *</label>
        <input type="text" id="fatherName" required>

        <label>जन्म मिति (वि.सं.): *</label>
        <input type="text" id="dob" placeholder="YYYY-MM-DD" required>

        <label>सम्पर्क फोन नं.: *</label>
        <input type="tel" id="mobile" required>

        <div class="esewa-box">
            <label style="margin-top:0; color:#27ae60;">eSewa Payment Code (Txn ID): *</label>
            <input type="text" id="esewaTxnId" placeholder="उदा: 8X92K1L" required>
        </div>

        <button type="submit" id="btnSubmit">निवेदन पेश गर्नुहोस्</button>
    </form>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
        databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    document.getElementById('nagarikataForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = "पेश हुँदैछ...";

        const subId = "NIV-" + Math.floor(10000 + Math.random() * 90000);
        
        const data = {
            submissionId: subId,
            serviceType: "नेपाली नागरिकता सिफारिश",
            fullName: document.getElementById('fullName').value.trim(),
            fatherName: document.getElementById('fatherName').value.trim(),
            dob: document.getElementById('dob').value.trim(),
            mobile: document.getElementById('mobile').value.trim(),
            esewaTxnId: document.getElementById('esewaTxnId').value.trim(),
            status: "Pending",
            createdDate: new Date().toISOString()
        };

        try {
            await db.ref("applications/" + subId).set(data);
            window.location.href = "../customer/submit.html?id=" + subId;
        } catch (err) {
            alert("त्रुटि आयो: " + err.message);
            btn.disabled = false;
            btn.innerText = "निवेदन पेश गर्नुहोस्";
        }
    });
</script>
</body>
</html>
