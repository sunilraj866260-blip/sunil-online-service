<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunil Online Service - Admin Panel</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Compatibility SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <!-- Header -->
        <div class="bg-blue-800 text-white p-4 rounded-lg mb-6 text-center">
            <h1 class="text-xl md:text-2xl font-bold">🔐 Sunil Online Service - Payment Approval Panel</h1>
            <p class="text-sm text-blue-200 mt-1">Real-time Transaction Verification</p>
        </div>

        <!-- Section Title -->
        <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
            📥 आएका अनुरोधहरू (Pending Requests)
        </h2>

        <!-- Loading / Status Container -->
        <div id="loadingStatus" class="text-center py-6 text-gray-500 font-medium">
            लोड हुँदैछ...
        </div>

        <!-- Requests List Container -->
        <div id="requestsList" class="space-y-4 hidden">
            <!-- Dynamic Data Will Appear Here -->
        </div>
    </div>

    <!-- Firebase Script Logic -->
    <script>
        // Firebase Configuration with Your Exact Keys
        const firebaseConfig = {
            apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
            databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const loadingStatus = document.getElementById('loadingStatus');
        const requestsList = document.getElementById('requestsList');

        // Real-time Listening for Requests
        database.ref('requests').on('value', (snapshot) => {
            const data = snapshot.val();
            requestsList.innerHTML = '';
            loadingStatus.classList.add('hidden');
            requestsList.classList.remove('hidden');

            if (!data) {
                requestsList.innerHTML = `
                    <div class="text-center py-8 text-gray-500 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                        कुनै पनि नयाँ अनुरोध (Pending Request) आएको छैन।
                    </div>`;
                return;
            }

            let hasPending = false;

            // Loop through all transaction requests
            Object.keys(data).forEach((key) => {
                const item = data[key];

                // Only show pending requests
                if (item.status === 'pending') {
                    hasPending = true;
                    const dateStr = item.timestamp ? new Date(item.timestamp).toLocaleString('ne-NP') : 'N/A';

                    const card = document.createElement('div');
                    card.className = "flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-yellow-50 border border-yellow-200 rounded-lg shadow-sm gap-4";
                    card.innerHTML = `
                        <div>
                            <p class="text-xs text-gray-500 font-mono">Tx Code / ID:</p>
                            <p class="text-lg font-bold text-gray-800 font-mono">${item.transactionCode || key}</p>
                            <p class="text-xs text-gray-400 mt-1">समय: ${dateStr}</p>
                        </div>
                        <div class="flex gap-2 w-full sm:w-auto">
                            <button onclick="approveTx('${key}')" class="flex-1 sm:flex-none bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm font-semibold transition">
                                ✓ Approve
                            </button>
                            <button onclick="rejectTx('${key}')" class="flex-1 sm:flex-none bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md text-sm font-semibold transition">
                                ✕ Reject
                            </button>
                        </div>
                    `;
                    requestsList.appendChild(card);
                }
            });

            if (!hasPending) {
                requestsList.innerHTML = `
                    <div class="text-center py-8 text-gray-500 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                        सबै अनुरोधहरू Approve/Reject भइसकेका छन्।
                    </div>`;
            }
        }, (error) => {
            loadingStatus.classList.remove('hidden');
            loadingStatus.innerHTML = `<span class="text-red-500">डेटा लोड गर्न सकिएन: ${error.message}</span>`;
        });

        // Approve Functionality
        function approveTx(key) {
            if (confirm("के तपाईँ यो भुक्तानी Approve गर्न चाहनुहुन्छ?")) {
                database.ref('requests/' + key).update({
                    status: 'approved',
                    approvedAt: Date.now()
                }).then(() => {
                    alert("सफलतापूर्वक Approve भयो!");
                }).catch((err) => {
                    alert("Error: " + err.message);
                });
            }
        }

        // Reject Functionality
        function rejectTx(key) {
            if (confirm("के तपाईँ यो अनुरोध अस्वीकार (Reject) गर्न चाहनुहुन्छ?")) {
                database.ref('requests/' + key).update({
                    status: 'rejected',
                    rejectedAt: Date.now()
                }).then(() => {
                    alert("अनुरोध Reject गरियो!");
                }).catch((err) => {
                    alert("Error: " + err.message);
                });
            }
        }
    </script>
</body>
</html>
