<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>जन्म दर्ता सिफारिश फारम - सुनील अनलाइन सेवा</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Compatibility SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; margin: 0; }
            .a4-page { shadow: none; border: none; width: 100%; margin: 0; padding: 15mm; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-6 px-4 font-sans">

    <!-- Form & Payment Container -->
    <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-md p-6 a4-page">
        
        <!-- Header -->
        <div class="text-center border-b pb-4 mb-6">
            <h1 class="text-2xl font-bold text-red-700">जन्म दर्ता सिफारिश फारम</h1>
            <p class="text-sm text-gray-600">सुनील अनलाइन सेवा - रोहिणी-१, रूपन्देही</p>
        </div>

        <!-- Registration Form -->
        <form id="birthForm" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">बालक/बालिकाको पूरा नाम:</label>
                    <input type="text" id="childName" required class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">जन्म मिति (बि.सं.):</label>
                    <input type="text" id="dob" placeholder="YYYY-MM-DD" required class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">बाबुको नाम:</label>
                    <input type="text" id="fatherName" required class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">आमाको नाम:</label>
                    <input type="text" id="motherName" required class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- Submit Form Button -->
            <div class="no-print pt-4">
                <button type="submit" id="submitFormBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">
                    पेश गर्नुहोस् र भुक्तानीमा जानुहोस्
                </button>
            </div>
        </form>

        <!-- eSewa Payment Verification Modal / Section -->
        <div id="paymentModal" class="hidden no-print mt-6 p-6 bg-yellow-50 border border-yellow-300 rounded-lg">
            <h3 class="text-lg font-bold text-yellow-800 mb-2">💳 भुक्तानी तथा अनलक प्रक्रिया</h3>
            <p class="text-sm text-gray-700 mb-4">
                कृपया eSewa बाट रु. ५० भुक्तानी गरी प्राप्त भएको **Transaction Code (Tx Code)** तल राखेर पठाइदिनुहोस्। पसलेले Approve गरेपछि फारम प्रिन्ट हुनेछ।
            </p>

            <form id="paymentForm" class="space-y-3">
                <div>
                    <label class="block text-sm font-semibold text-gray-800 mb-1">eSewa Transaction Code:</label>
                    <input type="text" id="txCodeInput" placeholder="उदा: 7X89234" required class="w-full p-3 border border-gray-400 rounded text-lg font-mono uppercase focus:ring-2 focus:ring-green-500 outline-none">
                </div>
                <button type="submit" id="unlockBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded text-lg transition">
                    🔓 Unlock Form (अनुरोध पठाउनुहोस्)
                </button>
            </form>

            <div id="statusMessage" class="hidden mt-4 p-3 rounded text-center text-sm font-bold"></div>
        </div>

        <!-- Print Button (Only shows after approval) -->
        <div id="printSection" class="hidden no-print mt-6 text-center">
            <button onclick="window.print()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-lg text-lg shadow-lg transition">
                🖨️ A4 Size मा Print गर्नुहोस्
            </button>
        </div>

    </div>

    <!-- Firebase Script Logic -->
    <script>
        // 1. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
            databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        const birthForm = document.getElementById('birthForm');
        const paymentModal = document.getElementById('paymentModal');
        const paymentForm = document.getElementById('paymentForm');
        const statusMessage = document.getElementById('statusMessage');
        const printSection = document.getElementById('printSection');
        const submitFormBtn = document.getElementById('submitFormBtn');

        // 2. Form Submit Handler
        birthForm.addEventListener('submit', function(e) {
            e.preventDefault(); // रिफ्रेस हुन नदिने
            submitFormBtn.disabled = true;
            submitFormBtn.classList.add('bg-gray-400');
            paymentModal.classList.remove('hidden');
            paymentModal.scrollIntoView({ behavior: 'smooth' });
        });

        // 3. Payment Code Submit Handler
        paymentForm.addEventListener('submit', function(e) {
            e.preventDefault(); // रिडाइरेक्ट वा रिफ्रेस हुन दिँदैन!

            const txCode = document.getElementById('txCodeInput').value.trim();

            if (!txCode) {
                alert("कृपया eSewa Transaction Code राख्नुहोस्!");
                return;
            }

            // Status message update
            statusMessage.className = "mt-4 p-3 rounded text-center text-sm font-bold bg-blue-100 text-blue-800 border border-blue-300";
            statusMessage.innerText = "अनुरोध पठाउँदैछ... कृपया पर्खनुहोस्।";
            statusMessage.classList.remove('hidden');

            // Save to Firebase Realtime Database
            database.ref('requests/' + txCode).set({
                transactionCode: txCode,
                childName: document.getElementById('childName').value,
                status: 'pending',
                timestamp: Date.now()
            }).then(() => {
                statusMessage.className = "mt-4 p-3 rounded text-center text-sm font-bold bg-yellow-100 text-yellow-800 border border-yellow-300";
                statusMessage.innerText = "⏳ अनुरोध पठाइयो! पसलेले Approve गर्दै हुनुहुन्छ, पाना स्वतः खुल्नेछ...";
                
                // Real-time listener for approval status
                listenForApproval(txCode);
            }).catch((error) => {
                statusMessage.className = "mt-4 p-3 rounded text-center text-sm font-bold bg-red-100 text-red-800 border border-red-300";
                statusMessage.innerText = "त्रुटि भयो: " + error.message;
            });
        });

        // 4. Listen for Approval Status
        function listenForApproval(txCode) {
            database.ref('requests/' + txCode).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.status === 'approved') {
                    statusMessage.className = "mt-4 p-3 rounded text-center text-sm font-bold bg-green-100 text-green-800 border border-green-300";
                    statusMessage.innerText = "✅ भुक्तानी स्वीकृत भयो! अब तपाईँ फारम प्रिन्ट गर्न सक्नुहुन्छ।";
                    
                    paymentForm.classList.add('hidden');
                    printSection.classList.remove('hidden');
                } else if (data && data.status === 'rejected') {
                    statusMessage.className = "mt-4 p-3 rounded text-center text-sm font-bold bg-red-100 text-red-800 border border-red-300";
                    statusMessage.innerText = "❌ तपाईँको अनुरोध अस्वीकृत (Rejected) भयो। कृपया सही Tx Code हाल्नुहोस्।";
                }
            });
        }
    </script>
</body>
</html>
