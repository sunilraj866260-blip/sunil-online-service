<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunil Photo Studio - फर्महरूको सूची</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .header-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto 20px auto;
        }
        /* लोगो स्टाइल */
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #007bff;
            margin-bottom: 10px;
        }
        h1 {
            color: #333;
            margin: 10px 0 5px 0;
            font-size: 24px;
        }
        .contact {
            color: #555;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        p {
            color: #666;
        }
        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        /* फ्रेम कार्ड (जसमा क्लिक गर्दा फर्म खुल्छ) */
        .frame-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 220px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
        }
        .frame-card:hover {
            border-color: #007bff;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            transform: translateY(-5px);
        }
        /* फ्रेम भित्रको डिजाइन फोटो */
        .frame-card img.design-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .frame-card h3 {
            margin: 10px 0;
            color: #333;
            font-size: 18px;
        }
        /* पुरै फ्रेमलाई लिङ्क बनाउनको लागि */
        .card-link {
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- स्टुडियोको विवरण र लोगो -->
    <div class="header-box">
        <!-- यहाँ आफ्नो लोगोको फाइल नाम राख्नुहोला (जस्तै: logo.jpg) -->
        <img src="logo.jpg" alt="Sunil Photo Studio Logo" class="logo">
        <h1>Sunil Photo Studio</h1>
        <div class="contact">सम्पर्क नम्बर: 9817423830</div>
        <p>तपाईंलाई चाहिएको फर्मको डिजाइनमा क्लिक गर्नुहोस्:</p>
    </div>

    <div class="container">
        <!-- सुनिलको फर्म - पुरै फ्रेम डिजाइनसहित (क्लिक गर्न मिल्ने) -->
        <a href="sunil1.html" class="card-link">
        <a href="sunil2.html" class="card-link">
            <div class="frame-card">
                <!-- यहाँ आफ्नो फ्रेमको डिजाइन फोटोको नाम राख्नुहोला (जस्तै: frame1.jpg) -->
                <img src="frame1.jpg" alt="फ्रेम डिजाइन" class="design-img">
                <img src="frame2.jpg" alt="फ्रेम डिजाइन" class="design-img">
                <h3>सुनिलको फर्म</h3>
            </div>
        </a>

        <!-- यदि अझै नयाँ फर्महरू थप्न मन lage, माथिको 'card-link'वाला भागलाई कपि गरेर तल फेरि राख्न सक्नुहुन्छ -->
    </div>

</body>
</html>
