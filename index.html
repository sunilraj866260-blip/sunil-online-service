<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>निवेदन प्रणाली - रोहिणी वडा नं. १</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#f1f5f9;
    color:#222;
}

header{
    background:#0b5ed7;
    color:white;
    padding:22px 15px;
    text-align:center;
}

header h1{
    margin:0 0 6px;
    font-size:26px;
}

header p{
    margin:0;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 3px 12px #0001;
}

.card h2{
    margin-top:0;
    text-align:center;
}

.forms{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:15px;
}

.form-btn{
    display:block;
    text-decoration:none;
    background:#fff;
    border:2px solid #0b5ed7;
    color:#0b5ed7;
    padding:18px 10px;
    border-radius:10px;
    text-align:center;
    font-size:17px;
    font-weight:bold;
    transition:.2s;
}

.form-btn:hover{
    background:#0b5ed7;
    color:white;
}

input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #bbb;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:7px;
    background:#0b5ed7;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#084298;
}

.result{
    margin-top:15px;
    padding:15px;
    border-radius:8px;
    background:#f8fafc;
    display:none;
}

.status{
    padding:8px;
    border-radius:5px;
    display:inline-block;
    font-weight:bold;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.verified{
    background:#d1e7dd;
    color:#0f5132;
}

.rejected{
    background:#f8d7da;
    color:#842029;
}

.printed{
    background:#cff4fc;
    color:#055160;
}

.admin-link{
    text-align:center;
    margin-top:15px;
}

.admin-link a{
    color:#555;
}

footer{
    text-align:center;
    padding:20px;
    color:#666;
}
</style>
</head>

<body>

<header>
    <h1>रोहिणी गाउँपालिका वडा नं. १</h1>
    <p>डिजिटल निवेदन प्रणाली</p>
</header>

<div class="container">

    <!-- NIVEDAN -->
    <div class="card">
        <h2>📋 निवेदन / सिफारिस छनोट गर्नुहोस्</h2>

        <div class="forms">

            <a class="form-btn" href="forms/janma.html">
                जन्मदर्ता
            </a>

            <a class="form-btn" href="forms/bibaha.html">
                विवाहदर्ता
            </a>

            <a class="form-btn" href="forms/mrityu.html">
                मृत्युदर्ता
            </a>

            <a class="form-btn" href="forms/nagarikata.html">
                नागरिकता सिफारिस
            </a>

            <a class="form-btn" href="forms/charkilla.html">
                चारकिल्ला सिफारिस
            </a>

        </div>
    </div>


    <!-- TRACK -->
    <div class="card">

        <h2>🔎 निवेदन Track गर्नुहोस्</h2>

        <p>
            आफ्नो Mobile Number र eSewa Code राखेर
            निवेदनको अवस्था हेर्नुहोस्।
        </p>

        <input
            type="text"
            id="trackMobile"
            placeholder="Mobile Number">

        <input
            type="text"
            id="trackEsewa"
            placeholder="eSewa Code">

        <button onclick="trackRequest()">
            🔎 TRACK
        </button>

        <div id="result" class="result"></div>

    </div>


    <!-- ADMIN -->
    <div class="card admin-link">
        <a href="admin.html">
            🔐 Admin Login
        </a>
    </div>

</div>

<footer>
    © Rohini-1 Digital Nivedan System
</footer>


<script>

const DB =
"https://sunil-online-service-default-rtdb.firebaseio.com";


async function trackRequest(){

    const mobile =
        document.getElementById("trackMobile").value.trim();

    const esewa =
        document.getElementById("trackEsewa").value.trim();

    const result =
        document.getElementById("result");

    if(!mobile || !esewa){

        alert("Mobile Number र eSewa Code दुवै राख्नुहोस्।");
        return;
    }

    result.style.display="block";
    result.innerHTML="Loading...";

    try{

        const response =
            await fetch(DB + "/requests.json");

        const data =
            await response.json();

        let found=null;
        let id=null;

        if(data){

            for(const key in data){

                const item=data[key];

                if(
                    String(item.mobile) === String(mobile) &&
                    String(item.esewa) === String(esewa)
                ){

                    found=item;
                    id=key;
                    break;
                }
            }
        }

        if(!found){

            result.innerHTML=
            "<b>❌ निवेदन भेटिएन।</b><br><br>"+
            "Mobile Number वा eSewa Code जाँच गर्नुहोस्।";

            return;
        }


        let statusClass="pending";

        if(found.status==="Verified")
            statusClass="verified";

        if(found.status==="Rejected")
            statusClass="rejected";

        if(found.status==="Printed")
            statusClass="printed";


        let html=`

            <h3>निवेदन भेटियो ✅</h3>

            <p>
                <b>नाम:</b>
                ${escapeHTML(found.name || "-")}
            </p>

            <p>
                <b>Mobile:</b>
                ${escapeHTML(found.mobile || "-")}
            </p>

            <p>
                <b>निवेदन:</b>
                ${escapeHTML(found.formName || "-")}
            </p>

            <p>
                <b>eSewa Code:</b>
                ${escapeHTML(found.esewa || "-")}
            </p>

            <p>
                <b>Status:</b>
                <span class="status ${statusClass}">
                ${escapeHTML(found.status || "Pending")}
                </span>
            </p>
        `;


        if(
            found.status==="Verified" ||
            found.status==="Printed"
        ){

            html += `
                <br>
                <button onclick="openPrint('${id}')">
                    🖨️ PRINT / OPEN
                </button>
            `;
        }

        if(found.status==="Pending"){

            html += `
                <p>
                ⏳ Admin ले payment verify गर्न बाँकी छ।
                </p>
            `;
        }

        if(found.status==="Rejected"){

            html += `
                <p>
                ❌ Payment verify भएन।
                Admin सँग सम्पर्क गर्नुहोस्।
                </p>
            `;
        }


        result.innerHTML=html;

    }catch(error){

        console.error(error);

        result.innerHTML=
        "❌ Firebase connection error";
    }
}


function openPrint(id){

    localStorage.setItem(
        "nivedan_track_request",
        id
    );

    alert(
        "यो request को original form खोल्नुपर्छ। "+
        "Demo मा form पुनः खोलिनेछ।"
    );
}


function escapeHTML(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

</script>

</body>
</html>
