<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सिफारिस प्रणाली - रोहिणी-१</title>
    
    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f7f6; padding: 20px; margin: 0; }
        .entry-form { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1e3799; border-bottom: 2px solid #1e3799; padding-bottom: 10px; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        
        .row { display: flex; gap: 20px; }
        .row .input-group { flex: 1; }
        
        /* Mobile Responsive */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .entry-form { padding: 15px; }
            .row { flex-direction: column; gap: 0; }
            button { padding: 14px; font-size: 18px; }
        }

        button { width: 100%; padding: 18px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 20px; font-weight: bold; margin-top: 10px; }
        button:hover { background: #219150; }
        
        .section-title { background: #e8ecef; padding: 10px; margin: 20px 0 10px 0; font-weight: bold; border-left: 6px solid #1e3799; }
        
        .btn-add { background: #1e3799; padding: 12px 20px; font-size: 15px; margin-bottom: 20px; width: auto; border-radius: 5px; }
        .btn-add:hover { background: #0c2461; }
        
        .btn-danger { background: #c0392b; padding: 8px 14px; font-size: 14px; width: auto; margin-top: 5px; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .child-box { border: 1px dashed #1e3799; padding: 15px; margin-bottom: 15px; background: #f9fbfd; border-radius: 6px; }
        
        .status-msg { text-align: center; font-size: 18px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body onload="setInitialDate()">

<div class="entry-form">
    <h2>वडा सिफारिस प्रणाली (रोहिणी-१)</h2>
    <div class="input-group">
        <label>सिफारिसको प्रकार छान्नुहोस्:</label>
        <select id="n_type">
            <option value="nabalak">जन्म दर्ता गरिपाऊँ।</option>
        </select>
    </div>

    <div class="row">
        <div class="input-group"><label>मिति (वि.सं.):</label><input type="text" id="in_today"></div>
        <div class="input-group"><label>फोन नं.:</label><input type="text" id="in_phone" value="9817423830"></div>
    </div>

    <div class="section-title">मुख्य विवरण</div>
    
    <div class="row">
        <div class="input-group">
            <label>निवेदक बच्चाको को हुनुहुन्छ ?</label>
            <select id="in_applicant_role">
                <option value="बुवा">बुवा (पिता)</option>
                <option value="आमा">आमा (माता)</option>
            </select>
        </div>
        <div class="input-group"><label>निवेदकको नाम:</label><input type="text" id="in_name" placeholder="निवेदकको नाम"></div>
    </div>

    <div class="row">
        <div class="input-group"><label>बच्चाको बुवाको नाम:</label><input type="text" id="in_father" placeholder="बुवाको नाम"></div>
        <div class="input-group"><label>बाजेको नाम:</label><input type="text" id="in_grandpa" placeholder="बाजेको नाम"></div>
    </div>
    
    <div class="row">
        <div class="input-group">
            <label>निवेदक (बाजेको के हो?):</label>
            <select id="in_grandpa_rel">
                <option value="नाति">नाति</option>
                <option value="नातिनी">नातिनी</option>
                <option value="बुहारी">बुहारी</option>
            </select>
        </div>
        <div class="input-group">
            <label>निवेदक (बुवाको के हो?):</label>
            <select id="in_father_rel">
                <option value="छोरा">छोरा</option>
                <option value="छोरी">छोरी</option>
                <option value="श्रीमती">श्रीमती</option>
            </select>
        </div>
    </div>
    
    <div class="row">
        <div class="input-group"><label>माता-पिताको विवाह भएको मिति:</label><input type="text" id="in_marriage_date" placeholder="२०७८/१०/१२"></div>
        <div class="input-group"></div>
    </div>

    <div class="section-title">बच्चा(हरू)को विवरण</div>
    <div id="children_container">
        <div class="child-box" id="child_block_1">
            <div class="row">
                <div class="input-group"><label>बच्चाको नाम:</label><input type="text" class="child-name"></div>
                <div class="input-group">
                    <label>बच्चाको लिङ्ग (छोरा/छोरी):</label>
                    <select class="child-gender">
                        <option value="छोरा">छोरा</option>
                        <option value="छोरी">छोरी</option>
                    </select>
                </div>
                <div class="input-group"><label>बच्चाको जन्म मिति:</label><input type="text" class="child-dob"></div>
            </div>
            <div class="row">
                <div class="input-group"><label>जन्मस्थान:</label><input type="text" class="child-birthplace" placeholder="उदाहरन: रोहिणी-१, रुपन्देही"></div>
                <div class="input-group"><label>टोकन नम्बर:</label><input type="text" class="child-token" placeholder="टोकन नं."></div>
            </div>
        </div>
    </div>
    
    <button type="button" class="btn-add" onclick="addChildBox()">+ थप बच्चा थप्नुहोस् (Add Child)</button>

    <button id="btnSubmit" onclick="sendRequest()">अनुरोध पठाउनुहोस् (Send Request)</button>
    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
    // FIREBASE SETUP
    const firebaseConfig = {
        apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
        databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let childCount = 1;

    function setInitialDate() {
        try {
            const options = { year: 'numeric', month: 'numeric', day: 'numeric', calendar: 'nepali' };
            document.getElementById('in_today').value = new Intl.DateTimeFormat('ne-NP-u-ca-nepali', options).format(new Date());
        } catch (e) { 
            document.getElementById('in_today').value = "२०८३/०३/२७"; 
        }
    }

    function addChildBox() {
        childCount++;
        const container = document.getElementById('children_container');
        const html = `
            <div class="child-box" id="child_block_${childCount}">
                <div class="row">
                    <div class="input-group"><label>बच्चाको नाम:</label><input type="text" class="child-name"></div>
                    <div class="input-group">
                        <label>बच्चाको लिङ्ग (छोरा/छोरी):</label>
                        <select class="child-gender">
                            <option value="छोरा">छोरा</option>
                            <option value="छोरी">छोरी</option>
                        </select>
                    </div>
                    <div class="input-group"><label>बच्चाको जन्म मिति:</label><input type="text" class="child-dob"></div>
                </div>
                <div class="row">
                    <div class="input-group"><label>जन्मस्थान:</label><input type="text" class="child-birthplace" placeholder="उदाहरन: रोहिणी-१, रुपन्देही"></div>
                    <div class="input-group"><label>टोकन नम्बर:</label><input type="text" class="child-token" placeholder="टोकन नं."></div>
                </div>
                <button type="button" class="btn-danger" onclick="removeChildBox(${childCount})">यो बच्चा हटाउनुहोस्</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
    }

    function removeChildBox(id) {
        const block = document.getElementById(`child_block_${id}`);
        if(block) {
            block.remove();
        }
    }

    // Firebase मा Request पठाउने फसन
    function sendRequest() {
        const name = document.getElementById('in_name').value.trim();
        const statusMsg = document.getElementById('statusMsg');
        const btnSubmit = document.getElementById('btnSubmit');

        if (!name) {
            alert("कृपया निवेदकको नाम भर्नुहोस्!");
            return;
        }

        btnSubmit.disabled = true;
        btnSubmit.innerText = "अनुरोध पठाउँदैछ...";
        statusMsg.style.color = "#d35400";
        statusMsg.innerText = "⏳ विवरण सङ्कलन हुँदैछ...";

        const names = document.querySelectorAll('.child-name');
        const genders = document.querySelectorAll('.child-gender');
        const dobs = document.querySelectorAll('.child-dob');
        const birthplaces = document.querySelectorAll('.child-birthplace');
        const tokens = document.querySelectorAll('.child-token');

        let childrenList = [];
        for (let i = 0; i < names.length; i++) {
            childrenList.push({
                name: names[i].value.trim(),
                gender: genders[i].value,
                dob: dobs[i].value.trim(),
                birthplace: birthplaces[i].value.trim(),
                token: tokens[i].value.trim()
            });
        }

        const requestData = {
            today: document.getElementById('in_today').value,
            phone: document.getElementById('in_phone').value,
            applicant_name: name,
            father_name: document.getElementById('in_father').value.trim(),
            grandpa_name: document.getElementById('in_grandpa').value.trim(),
            grandpa_rel: document.getElementById('in_grandpa_rel').value,
            father_rel: document.getElementById('in_father_rel').value,
            marriage_date: document.getElementById('in_marriage_date').value.trim(),
            applicant_role: document.getElementById('in_applicant_role').value,
            children: childrenList,
            status: "PENDING",
            timestamp: new Date().toLocaleString()
        };

        // Firebase Realtime Database मा सेभ गर्ने
        database.ref('requests').push(requestData)
            .then(() => {
                statusMsg.style.color = "#27ae60";
                statusMsg.innerText = "✅ अनुरोध सफलतापूर्वक पठाइयो!";
                btnSubmit.disabled = false;
                btnSubmit.innerText = "अनुरोध पठाउनुहोस् (Send Request)";
            })
            .catch((error) => {
                console.error("Firebase Error: ", error);
                statusMsg.style.color = "#c0392b";
                statusMsg.innerText = "❌ त्रुटि आयो! पुनः प्रयास गर्नुहोस्।";
                btnSubmit.disabled = false;
                btnSubmit.innerText = "अनुरोध पठाउनुहोस् (Send Request)";
            });
    }
</script>
</body>
</html>
