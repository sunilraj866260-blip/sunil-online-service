<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>निवेदन प्रणाली - रोहिणी १</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#f1f4f7;
    color:#222;
}

header{
    background:#1769aa;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0;
    font-size:27px;
}

header p{
    margin:8px 0 0;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:22px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
    color:#1769aa;
    margin-top:0;
}

.track-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #aaa;
    border-radius:6px;
    font-size:16px;
}

button{
    padding:12px 20px;
    border:0;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

.track-btn{
    margin-top:15px;
    background:#1769aa;
    color:white;
}

.forms{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
}

.form-link{
    display:block;
    text-align:center;
    text-decoration:none;
    padding:15px;
    border:1px solid #ddd;
    border-radius:7px;
    color:#1769aa;
    background:white;
    font-weight:bold;
}

.form-link:hover{
    background:#eef7ff;
}

.result{
    margin-top:20px;
}

.result-box{
    border:1px solid #ddd;
    border-radius:8px;
    padding:18px;
    background:#fafafa;
}

.result-row{
    padding:8px 0;
    border-bottom:1px solid #eee;
}

.status{
    display:inline-block;
    padding:7px 14px;
    border-radius:20px;
    font-weight:bold;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.verified{
    background:#d4edda;
    color:#155724;
}

.rejected{
    background:#f8d7da;
    color:#721c24;
}

.printed{
    background:#d1ecf1;
    color:#0c5460;
}

.open-btn{
    background:#198754;
    color:white;
    margin-top:15px;
}

.error{
    background:#f8d7da;
    color:#721c24;
    padding:12px;
    border-radius:6px;
}

.info{
    background:#fff3cd;
    color:#856404;
    padding:12px;
    border-radius:6px;
}

footer{
    text-align:center;
    padding:20px;
    color:#666;
}

@media(max-width:600px){

    .track-grid{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:21px;
    }

}

</style>
</head>

<body>

<header>

    <h1>
        निवेदन प्रणाली
    </h1>

    <p>
        रोहिणी गाउँपालिका वडा नं. १, रुपन्देही
    </p>

</header>


<div class="container">


<!-- ==============================
     TRACK
================================ -->

<div class="card">

    <h2>🔎 निवेदन Track गर्नुहोस्</h2>

    <p>
        Mobile Number र eSewa Code प्रयोग गरेर
        आफ्नो निवेदनको अवस्था हेर्नुहोस्।
    </p>


    <div class="track-grid">

        <div>

            <label>
                मोबाइल नम्बर
            </label>

            <input
                id="mobile"
                type="tel"
                placeholder="98XXXXXXXX"
            >

        </div>


        <div>

            <label>
                eSewa Code
            </label>

            <input
                id="esewa"
                type="text"
                placeholder="eSewa Code"
            >

        </div>

    </div>


    <button
        class="track-btn"
        onclick="trackRequest()"
    >
        🔎 Track
    </button>


    <div
        id="result"
        class="result"
    ></div>

</div>



<!-- ==============================
     FORMS
================================ -->

<div class="card">

    <h2>
        📄 निवेदन फारम
    </h2>


    <div class="forms">

        <a
            class="form-link"
            href="forms/janma.html"
        >
            जन्मदर्ता
        </a>


        <!-- पछि थप्नुहोस् -->

        <a
            class="form-link"
            href="#"
        >
            विवाहदर्ता
        </a>


        <a
            class="form-link"
            href="#"
        >
            मृत्युदर्ता
        </a>


        <a
            class="form-link"
            href="#"
        >
            बसाइँसराइ
        </a>


        <a
            class="form-link"
            href="#"
        >
            नागरिकता सिफारिस
        </a>


        <a
            class="form-link"
            href="#"
        >
            चारकिल्ला
        </a>

    </div>

</div>


</div>


<footer>

    © रोहिणी गाउँपालिका वडा नं. १

</footer>


<script>

const DB =
"https://sunil-online-service-default-rtdb.firebaseio.com";


async function trackRequest(){

    const mobile =
        document.getElementById("mobile")
        .value.trim();

    const esewa =
        document.getElementById("esewa")
        .value.trim();

    const result =
        document.getElementById("result");


    if(!mobile || !esewa){

        result.innerHTML = `
            <div class="error">
                Mobile Number र eSewa Code दुवै राख्नुहोस्।
            </div>
        `;

        return;

    }


    result.innerHTML = `
        <div class="info">
            ⏳ खोजिँदैछ...
        </div>
    `;


    try{

        const response =
            await fetch(
                DB + "/requests.json"
            );


        const data =
            await response.json();


        if(!data){

            result.innerHTML = `
                <div class="error">
                    कुनै request भेटिएन।
                </div>
            `;

            return;

        }


        let found = null;


        for(const id in data){

            const item = data[id];


            if(
                String(item.mobile || "")
                .trim()
                === mobile
                &&
                String(item.esewa || "")
                .trim()
                === esewa
            ){

                found = {
                    id:id,
                    ...item
                };

            }

        }


        if(!found){

            result.innerHTML = `
                <div class="error">
                    ❌ Mobile Number वा eSewa Code गलत छ।
                </div>
            `;

            return;

        }


        showResult(found);

    }

    catch(error){

        console.error(error);

        result.innerHTML = `
            <div class="error">
                Firebase connection error।
            </div>
        `;

    }

}


function showResult(data){

    let status =
        data.status || "Pending";


    let statusClass =
        "pending";

    let statusText =
        "⏳ Pending";


    if(status === "Verified"){

        statusClass = "verified";
        statusText = "✅ Verified";

    }

    else if(status === "Rejected"){

        statusClass = "rejected";
        statusText = "❌ Rejected";

    }

    else if(status === "Printed"){

        statusClass = "printed";
        statusText = "🖨️ Printed";

    }


    let button = "";


    if(
        status === "Verified"
        ||
        status === "Printed"
    ){

        button = `
            <button
                class="open-btn"
                onclick="openForm('${data.id}')"
            >
                🖨️ Print / Open Form
            </button>
        `;

    }


    document.getElementById("result")
    .innerHTML = `

        <div class="result-box">

            <h3>
                निवेदन भेटियो
            </h3>

            <div class="result-row">
                <b>नाम:</b>
                ${escapeHtml(data.name || "-")}
            </div>

            <div class="result-row">
                <b>मोबाइल:</b>
                ${escapeHtml(data.mobile || "-")}
            </div>

            <div class="result-row">
                <b>eSewa Code:</b>
                ${escapeHtml(data.esewa || "-")}
            </div>

            <div class="result-row">
                <b>निवेदन:</b>
                ${escapeHtml(data.formName || "-")}
            </div>

            <div class="result-row">
                <b>Status:</b>
                <span class="status ${statusClass}">
                    ${statusText}
                </span>
            </div>

            ${statusMessage(status)}

            ${button}

        </div>
    `;

}


function statusMessage(status){

    if(status === "Pending"){

        return `
            <br>
            <div class="info">
                ⏳ Admin ले eSewa Code verify गर्न बाँकी छ।
            </div>
        `;

    }


    if(status === "Verified"){

        return `
            <br>
            <div style="
                background:#d4edda;
                color:#155724;
                padding:12px;
                border-radius:6px;">
                ✅ Payment Verify भयो।
                अब Print गर्न सकिन्छ।
            </div>
        `;

    }


    if(status === "Rejected"){

        return `
            <br>
            <div class="error">
                ❌ यो request Reject गरिएको छ।
            </div>
        `;

    }


    if(status === "Printed"){

        return `
            <br>
            <div style="
                background:#d1ecf1;
                color:#0c5460;
                padding:12px;
                border-radius:6px;">
                🖨️ यो निवेदन Print भइसकेको छ।
            </div>
        `;

    }

    return "";

}


function openForm(id){

    window.open(
        "forms/janma.html?request=" +
        encodeURIComponent(id),
        "_blank"
    );

}


function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
