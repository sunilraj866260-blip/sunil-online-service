<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रोहिणी वडा नं. १ - निवेदन प्रणाली</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f7f6; margin: 0; padding: 0; }
        header { background: #b71515; color: white; text-align: center; padding: 20px; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h3 { color: #b71515; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .track-box { display: flex; gap: 10px; margin-top: 10px; }
        .track-box input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .track-box button { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; margin-top: 15px; }
        .service-btn { display: block; text-align: center; background: #fff; border: 2px solid #b71515; color: #b71515; padding: 15px; border-radius: 6px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .service-btn:hover { background: #b71515; color: white; }
        #trackResult { margin-top: 15px; padding: 12px; border-radius: 5px; display: none; }
    </style>
</head>
<body>

<header>
    <h1>रोहिणी गाउँपालिका - १ नं. वडा कार्यालय</h1>
    <p>अनलाइन निवेदन तथा सिफारिश प्रणाली</p>
</header>

<div class="container">
    <div class="card">
        <h3>🔍 निवेदनको अवस्था जाँच (Track Application)</h3>
        <div class="track-box">
            <input type="text" id="trackInput" placeholder="Submission ID (उदा: NIV-12345) राख्नुहोस्">
            <button onclick="trackRequest()">खोज्नुहोस्</button>
        </div>
        <div id="trackResult"></div>
    </div>

    <div class="card">
        <h3>📝 अनलाइन निवेदन फारमहरू</h3>
        <div class="grid">
            <a href="forms/nagarikata.html" class="service-btn">नेपाली नागरिकता सिफारिश</a>
            <a href="forms/charKilla.html" class="service-btn">चार किल्ला प्रमाणीकरण</a>
            <a href="forms/nata.html" class="service-btn">नाता प्रमाणित सिफारिश</a>
            <a href="forms/janma.html" class="service-btn">जन्म दर्ता सिफारिश</a>
            <a href="forms/bibaha.html" class="service-btn">विवाह दर्ता सिफारिश</a>
            <a href="forms/basaiSarai.html" class="service-btn">बसाइँसराई सिफारिश</a>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
        databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function trackRequest() {
        const reqId = document.getElementById('trackInput').value.trim();
        const resDiv = document.getElementById('trackResult');
        if (!reqId) return alert("कृपया Submission ID राख्नुहोस्!");

        resDiv.style.display = "block";
        resDiv.innerHTML = "खोजी हुँदैछ...";

        db.ref("applications/" + reqId).once("value").then((snapshot) => {
            if (snapshot.exists()) {
                const d = snapshot.val();
                resDiv.style.background = "#e8f8f5";
                resDiv.style.border = "1px solid #27ae60";
                resDiv.innerHTML = `
                    <b>निवेदक:</b> ${d.fullName}<br>
                    <b>सेवा:</b> ${d.serviceType}<br>
                    <b>अवस्था (Status):</b> <strong style="color:#b71515;">${d.status}</strong>
                `;
            } else {
                resDiv.style.background = "#f8d7da";
                resDiv.style.border = "1px solid #c0392b";
                resDiv.innerHTML = "यो ID भएको निवेदन भेटिएन।";
            }
        });
    }
</script>
</body>
</html>
