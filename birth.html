<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>जन्म दर्ता सिफारिस अनलाइन निवेदन</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --primary: #1e3799; --secondary: #27ae60; --danger: #c0392b; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 15px; margin: 0; }
        .container { max-width: 900px; width: 100%; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px; font-size: 22px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #334155; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #f8fafc; }
        input:focus, select:focus { border-color: var(--primary); background: #fff; outline: none; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; }
        .row .input-group { flex: 1; min-width: 240px; }
        .btn-submit { width: 100%; padding: 14px; background: var(--secondary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; box-shadow: 0 4px 6px rgba(39, 174, 96, 0.2); }
        .btn-submit:hover { background: #219653; }
        .btn-add { background: var(--primary); color: white; padding: 10px 15px; font-size: 14px; margin-bottom: 15px; width: 100%; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .btn-danger { background: var(--danger); padding: 8px 12px; font-size: 13px; width: auto; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; }
        .section-title { background: #e2e8f0; padding: 10px; margin: 20px 0 15px 0; font-weight: bold; border-left: 6px solid var(--primary); font-size: 15px; color: #1e293b; }
        .child-box { border: 1px dashed var(--primary); padding: 15px; margin-bottom: 15px; background: #f9fbfd; border-radius: 8px; }
        .address-card { background: #e0f2fe; border: 1px solid #bae6fd; padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; color: #0369a1; }
        .top-links { text-align: left; margin-bottom: 15px; }
        .top-links a { color: var(--primary); text-decoration: none; font-weight: bold; font-size: 14px; background: #e1ebfd; padding: 8px 12px; border-radius: 6px; display: inline-block; }
    </style>
</head>
<body onload="loadSavedAddress(); setInitialDate();">

<div class="container">
    <div class="top-links">
        <a href="address.html">← अर्को ठेगाना परिवर्तन गर्नुहोस्</a>
    </div>
    <h2>जन्म दर्ता सिफारिस अनलाइन निवेदन फारम</h2>

    <!-- LocalStorage बाट आएको ठेगाना देखाउने सेक्सन -->
    <div class="address-card" id="displayAddressBox">
        📍 <b>छनोट गरिएको ठेगाना:</b> लोड हुँदैछ...
    </div>
    
    <form id="nivedanForm">
        <div class="section-title">१. निवेदकको व्यक्तिगत विवरण</div>
        <div class="row">
            <div class="input-group"><label>मिति (वि.सं.):</label><input type="text" id="in_today"></div>
            <div class="input-group"><label>फोन नं. (मोबाइल):</label><input type="text" id="in_phone" placeholder="98XXXXXXXX" required></div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>निवेदक बच्चाको को हुनुहुन्छ?</label>
                <select id="in_applicant_role">
                    <option value="बुवा">बुवा (पिता)</option>
                    <option value="आमा">आमा (माता)</option>
                </select>
            </div>
            <div class="input-group"><label>निवेदकको पूरा नाम:</label><input type="text" id="in_name" placeholder="पुरा नाम लेख्नुहोस्" required></div>
        </div>

        <div class="row">
            <div class="input-group"><label>बुवाको नाम:</label><input type="text" id="in_father" required></div>
            <div class="input-group"><label>बाजेको नाम:</label><input type="text" id="in_grandpa" required></div>
        </div>
        
        <div class="row">
            <div class="input-group">
                <label>नाता (बाजेको के हो?):</label>
                <select id="in_grandpa_rel">
                    <option value="नाति">नाति</option>
                    <option value="नातिनी">नातिनी</option>
                    <option value="बुहारी">बुहारी</option>
                </select>
            </div>
            <div class="input-group">
                <label>नाता (बुवाको के हो?):</label>
                <select id="in_father_rel">
                    <option value="छोरा">छोरा</option>
                    <option value="छोरी">छोरी</option>
                    <option value="श्रीमती">श्रीमती</option>
                </select>
            </div>
        </div>
        
        <div class="row">
            <div class="input-group"><label>विवाह भएको मिति:</label><input type="text" id="in_marriage_date" placeholder="२०७८/१०/१२" required></div>
        </div>

        <div class="section-title">२. बच्चा(हरू)को विवरण</div>
        <div id="children_container">
            <div class="child-box" id="child_block_1">
                <div class="row">
                    <div class="input-group"><label>बच्चाको नाम:</label><input type="text" class="child-name" required></div>
                    <div class="input-group">
                        <label>लिङ्ग:</label>
                        <select class="child-gender">
                            <option value="छोरा">छोरा</option>
                            <option value="छोरी">छोरी</option>
                        </select>
                    </div>
                    <div class="input-group"><label>जन्म मिति:</label><input type="text" class="child-dob" placeholder="२०८०/०५/१२" required></div>
                </div>
                <div class="row">
                    <div class="input-group"><label>जन्मस्थान:</label><input type="text" class="child-birthplace" value="घर / अस्पताल" required></div>
                    <div class="input-group"><label>टोकन नम्बर (यदि भए):</label><input type="text" class="child-token" placeholder="टोकन नं."></div>
                </div>
            </div>
        </div>
        
        <button type="button" class="btn-add" onclick="addChildBox()">+ अर्को बच्चा थप्नुहोस्</button>
        <button type="submit" class="btn-submit">जन्म दर्ता निवेदन सेभ गरी पठाउनुहोस् ➔</button>
    </form>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
        authDomain: "sunil-online-service.firebaseapp.com",
        databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com",
        projectId: "sunil-online-service",
        storageBucket: "sunil-online-service.appspot.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let globalAddress = {};

    function loadSavedAddress() {
        const saved = localStorage.getItem('savedAddress');
        if(!saved) {
            alert('पहिले ठेगाना छान्नुहोस्!');
            window.location.href = 'address.html';
            return;
        }
        globalAddress = JSON.parse(saved);
        document.getElementById('displayAddressBox').innerHTML = `
            📍 <b>छनोट गरिएको ठेगाना:</b> ${globalAddress.province}, ${globalAddress.district}, ${globalAddress.palikaName} ${globalAddress.localType}-${globalAddress.ward}, ${globalAddress.tole}
        `;
    }

    let childCount = 1;

    function setInitialDate() {
        try {
            const options = { year: 'numeric', month: 'numeric', day: 'numeric', calendar: 'nepali' };
            document.getElementById('in_today').value = new Intl.DateTimeFormat('ne-NP-u-ca-nepali', options).format(new Date());
        } catch (e) { document.getElementById('in_today').value = "२०८३/०३/२७"; }
    }

    function addChildBox() {
        childCount++;
        const container = document.getElementById('children_container');
        const html = `
            <div class="child-box" id="child_block_${childCount}">
                <div class="row">
                    <div class="input-group"><label>बच्चाको नाम:</label><input type="text" class="child-name" required></div>
                    <div class="input-group">
                        <label>लिङ्ग:</label>
                        <select class="child-gender">
                            <option value="छोरा">छोरा</option>
                            <option value="छोरी">छोरी</option>
                        </select>
                    </div>
                    <div class="input-group"><label>जन्म मिति:</label><input type="text" class="child-dob" placeholder="२०८०/०५/१२" required></div>
                </div>
                <div class="row">
                    <div class="input-group"><label>जन्मस्थान:</label><input type="text" class="child-birthplace" value="घर / अस्पताल" required></div>
                    <div class="input-group"><label>टोकन नम्बर:</label><input type="text" class="child-token" placeholder="टोकन नं."></div>
                </div>
                <button type="button" class="btn-danger" onclick="removeChildBox(${childCount})">यो बच्चा हटाउनुहोस्</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
    }

    function removeChildBox(id) {
        const block = document.getElementById(`child_block_${id}`);
        if(block) block.remove();
    }

    document.getElementById('nivedanForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = 'BIRTH-' + Date.now();

        const names = document.querySelectorAll('.child-name');
        const genders = document.querySelectorAll('.child-gender');
        const dobs = document.querySelectorAll('.child-dob');
        const birthplaces = document.querySelectorAll('.child-birthplace');
        const tokens = document.querySelectorAll('.child-token');

        let childrenData = [];
        for (let i = 0; i < names.length; i++) {
            childrenData.push({
                name: names[i].value.trim(),
                gender: genders[i].value,
                dob: dobs[i].value.trim(),
                birthplace: birthplaces[i].value.trim(),
                token: tokens[i].value.trim()
            });
        }

        const record = {
            id: id,
            type: 'जन्म दर्ता सिफारिस',
            ...globalAddress,
            today: document.getElementById('in_today').value.trim(),
            phone: document.getElementById('in_phone').value.trim(),
            applicantRole: document.getElementById('in_applicant_role').value,
            name: document.getElementById('in_name').value.trim(),
            father: document.getElementById('in_father').value.trim(),
            grandpa: document.getElementById('in_grandpa').value.trim(),
            grandpaRel: document.getElementById('in_grandpa_rel').value,
            fatherRel: document.getElementById('in_father_rel').value,
            marriageDate: document.getElementById('in_marriage_date').value.trim(),
            children: childrenData,
            status: 'Pending Verification',
            isVerified: false,
            esewaCode: ''
        };

        db.ref('universal_birth_nivedans/' + id).set(record, (error) => {
            if(error) {
                alert("डाटा सेभ गर्न समस्या भयो!");
            } else {
                alert('जन्म दर्ता निवेदन सफलतापुर्वक सेभ भयो! निवेदन ID: ' + id);
                document.getElementById('nivedanForm').reset();
            }
        });
    });
</script>
</body>
</html>
