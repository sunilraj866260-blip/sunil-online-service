<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>निवेदन ट्र्याकिङ तथा डाउनलोड</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="request.js"></script>
</head>
<body class="bg-slate-100 p-6 min-h-screen">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
        <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">निवेदन ट्र्याक तथा डाउनलोड</h2>
        
        <div class="flex gap-2 mb-6">
            <input type="text" id="trackInput" placeholder="टोकन नम्बर (उदा: NIV-123456)" class="flex-1 border p-3 rounded-xl outline-sky-600 font-mono font-bold uppercase">
            <button type="button" onclick="trackRequest()" class="bg-sky-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-sky-700 transition">खोज्नुहोस्</button>
        </div>

        <div id="result" class="hidden border-t pt-6 space-y-4">
            <div class="bg-slate-50 p-4 rounded-xl space-y-2 text-sm border">
                <p><strong>निवेदन प्रकार:</strong> <span id="resType"></span></p>
                <p><strong>दर्ता मिति:</strong> <span id="resDate"></span></p>
                <p><strong>eSewa Ref ID:</strong> <span id="resPaymentCode" class="font-mono font-bold text-amber-700"></span></p>
                <p><strong>अवस्था (Status):</strong> <span id="resStatus" class="font-bold"></span></p>
            </div>

            <div id="statusMessage" class="p-4 rounded-xl text-sm font-semibold"></div>

            <div id="downloadArea" class="hidden pt-2">
                <button type="button" onclick="downloadDocument()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3.5 rounded-xl font-bold transition shadow-lg flex items-center justify-center gap-2">
                    🖨️ निवेदन PDF / A4 मा प्रिन्ट/डाउनलोड गर्नुहोस्
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentRequest = null;

        const urlParams = new URLSearchParams(window.location.search);
        const urlToken = urlParams.get('token');
        if(urlToken) {
            document.getElementById('trackInput').value = urlToken;
            trackRequest();
        }

        async function trackRequest() {
            const token = document.getElementById('trackInput').value.trim();
            if(!token) {
                alert('कृपया टोकन नम्बर राख्नुहोस्!');
                return;
            }

            currentRequest = await getRequestByToken(token);

            if (currentRequest) {
                document.getElementById('resType').innerText = currentRequest.type;
                document.getElementById('resDate').innerText = currentRequest.date || '-';
                document.getElementById('resPaymentCode').innerText = currentRequest.paymentCode || 'हालिएको छैन';
                document.getElementById('resStatus').innerText = currentRequest.status;
                
                const statusMsg = document.getElementById('statusMessage');
                const downloadArea = document.getElementById('downloadArea');

                if (currentRequest.status === 'स्वीकृत (Approved)') {
                    statusMsg.className = "p-3 rounded-xl text-sm font-semibold bg-green-100 text-green-800 border border-green-200";
                    statusMsg.innerText = "✓ एडमिनबाट भेरिफाइ भयो! तपाईंको निवेदन तयार छ।";
                    downloadArea.classList.remove('hidden');
                } 
                else if (currentRequest.paymentCode) {
                    statusMsg.className = "p-3 rounded-xl text-sm font-semibold bg-yellow-100 text-yellow-800 border border-yellow-200";
                    statusMsg.innerText = "⏳ eSewa Code प्राप्त भयो। एडमिन/कार्यालयले भेरिफाइ (Verify) गर्दैछ, कृपया केही समयपछि पुनः ट्र्याक गर्नुहोस्।";
                    downloadArea.classList.add('hidden');
                } 
                else {
                    statusMsg.className = "p-3 rounded-xl text-sm font-semibold bg-amber-100 text-amber-800 border border-amber-200";
                    statusMsg.innerText = "⚠️ भुक्तानी बाँकी छ। कृपया QR स्क्यान गरी eSewa Code सबमिट गर्नुहोस्।";
                    downloadArea.classList.add('hidden');
                }

                document.getElementById('result').classList.remove('hidden');
            } else {
                alert('यो टोकन नम्बरको निवेदन फेला परेन।');
            }
        }

        function downloadDocument() {
            if (!currentRequest) return;
            const originalUrl = `${currentRequest.fileLink}?printToken=${currentRequest.token}`;
            window.open(originalUrl, '_blank');
        }
    </script>
</body>
</html>
