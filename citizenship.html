<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name='viewport' content='width=device-width, initial-scale=1'/>
    <title>नेपाली नागरिकता सिफारिस प्रणाली - रोहिणी वडा नं. १</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f1f2f6; padding: 20px; margin: 0; }
        .master-card { max-width: 850px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; font-size: 16px; font-weight: bold; background: #e0e0e0; border: none; border-radius: 6px; cursor: pointer; color: #333; width: auto; margin-top: 0; }
        .tab-btn.active { background: #b71515; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        h2 { text-align: center; color: #b71515; border-bottom: 3px solid #b71515; padding-bottom: 10px; margin-top: 0; }
        .section-title { background: #e9ecef; padding: 10px; margin: 20px 0 10px 0; font-weight: bold; border-left: 6px solid #b71515; color: #2d3436; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        .row { display: flex; gap: 15px; margin-bottom: 10px; }
        .row div { flex: 1; }
        button.action-btn { width: 100%; padding: 18px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 20px; font-weight: bold; margin-top: 20px; }
        button.action-btn:hover { background: #218838; }
        .address-banner { background: #fff3cd; border: 1px solid #ffeeba; padding: 12px; border-radius: 6px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        table.admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table.admin-table th, table.admin-table td { border: 1px solid #999; padding: 10px; text-align: center; color: #000; font-size: 14px; }
        table.admin-table th { background-color: #e9ecef; }
        #print-area { display: none; } 
    </style>
</head>
<body onload="initSystem()">

<div class="master-card">
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('formTab')">१. नागरिकता फारम</button>
        <button class="tab-btn" onclick="switchTab('trackTab')">२. ट्र्याकिङ / भुक्तानी</button>
        <button class="tab-btn" onclick="switchTab('adminTab')">३. Admin Panel</button>
    </div>

    <div class="address-banner">
        <div><strong>ठेगाना:</strong> <span id="display_address">लोड हुँदैछ...</span></div>
        <button onclick="changeAddress()" style="width: auto; padding: 6px 12px; font-size: 14px; margin: 0; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">ठेगाना फेर्नुहोस्</button>
    </div>

    <div id="formTab" class="tab-content active">
        <h2>नेपाली नागरिकता सिफारिस निवेदन फारम</h2>
        
        <div class="row">
            <div class="input-group"><label>आजको मिति (वि.सं.):</label><input type="text" id="in_date"></div>
            <div class="input-group"><label>निवेदकको नाम थर:</label><input type="text" id="cz_app_name" placeholder="नागरिकता लिनेको नाम"></div>
        </div>

        <div class="section-title">१. ठेगाना र पारिवारिक विवरण</div>
        <div class="row">
            <div><label>जिल्ला :</label><input type="text" id="cz_district" value="रुपन्देही"></div>
            <div><label>गाउँपालिका / नगरपालिका :</label><input type="text" id="cz_local_body" value="रोहिणी गाउँपालिका"></div>
        </div>
        <div class="row">
            <div><label>वडा नं. :</label><input type="text" id="cz_ward_no" value="१"></div>
            <div><label>टोलको नाम :</label><input type="text" id="cz_toll" placeholder="उदा: पिप्रहवा"></div>
        </div>
        
        <div class="row">
            <div><label>बाजेको नाम थर :</label><input type="text" id="cz_grand_name"></div>
            <div><label>नाता:</label><select id="cz_grand_relation"><option value="नाति">नाति</option><option value="नातिनी">नातिनी</option></select></div>
        </div>
        <div class="row">
            <div><label>बाबुको नाम थर :</label><input type="text" id="cz_father_name"></div>
            <div><label>नाता:</label><select id="cz_parent_relation"><option value="छोरा">छोरा</option><option value="छोरी">छोरी</option></select></div>
        </div>
        <div class="row">
            <div><label>मोवाइल नं.:</label><input type="text" id="cz_phone" placeholder="98XXXXXXXX"></div>
            <div><label>जन्म मिति:</label><input type="text" id="cz_dob" placeholder="२०--/--/--"></div>
        </div>

        <button class="action-btn" onclick="saveAndSubmitData()">फारम सेभ गर्नुहोस् र ट्र्याकिङमा जानुहोस्</button>
    </div>

    <div id="trackTab" class="tab-content">
        <h2>आवेदन ट्र्याकिङ</h2>
        <input type="text" id="track_input" placeholder="मोवाइल नं. लेख्नुहोस्">
        <button class="action-btn" onclick="checkApplicationStatus()">स्थिति हेर्नुहोस्</button>
        <div id="track_result" style="display:none; margin-top:15px;">
            <p>नाम: <span id="tr_name"></span> | स्थिति: <span id="tr_status"></span></p>
        </div>
    </div>

    <div id="adminTab" class="tab-content">
        <h2>Admin Panel</h2>
        <table class="admin-table">
            <thead><tr><th>मिति</th><th>नाम</th><th>मोबाइल</th><th>स्ट्याटस</th></tr></thead>
            <tbody id="admin_table_body"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY", authDomain: "YOUR_AUTH_DOMAIN", databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID", storageBucket: "YOUR_STORAGE_BUCKET", messagingSenderId: "YOUR_SENDER_ID", appId: "YOUR_APP_ID"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    function initSystem() {
        loadAddressFromLocalStorage();
    }

    function loadAddressFromLocalStorage() {
        const savedAddr = localStorage.getItem('savedAddress');
        if (savedAddr) {
            const addr = JSON.parse(savedAddr);
            document.getElementById('display_address').innerText = `${addr.district}, ${addr.palikaName} ${addr.localType}, वडा नं. ${addr.ward}`;
            document.getElementById('cz_district').value = addr.district;
            document.getElementById('cz_local_body5').value = addr.palikaName + " " + addr.localType;
            document.getElementById('cz_ward_no').value = addr.ward;
            if(addr.tole) document.getElementById('cz_toll').value = addr.tole;
        } else {
            document.getElementById('display_address').innerText = "ठेगाना सेभ गरिएको छैन।";
        }
    }

    function changeAddress() {
        // यहाँ address.html प्रयोग गरिएको छ (तपाईंको GitHub को नामसँग मिल्ने गरी)
        window.location.href = 'address.html?from=citizenship.html';
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function saveAndSubmitData() {
        alert("फारम सेभ भयो!");
    }
</script>
</body>
</html>
