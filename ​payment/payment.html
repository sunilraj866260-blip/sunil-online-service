<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <title>eSewa Payment Integration</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../config/firebase-config.js"></script>
    <script src="../common/payment.js"></script>
</head>
<body>
    <div class="container" style="max-width: 600px; text-align: center;">
        <h2>PAID PRINT (eSewa Online Payment)</h2>
        <p>बिना वाटरमार्क सफा कागजात प्रिन्ट गर्नको लागि Rs. 50 भुक्तानी गर्नुहोस्।</p>
        
        <div style="margin:20px 0;">
            <img src="esewa-qr.png" alt="eSewa QR Code" style="width: 200px; border:2px solid #27ae60; border-radius:8px;">
        </div>

        <form id="payForm">
            <div class="form-group" style="text-align:left;">
                <label>Tracking Nivedan ID (उदा: NIV-171000...):</label>
                <input type="text" id="nivedanId" required>
            </div>
            <div class="form-group" style="text-align:left;">
                <label>eSewa Transaction / Reference Code:</label>
                <input type="text" id="esewaCode" placeholder="उदा: 0000XXXX" required>
            </div>
            <button type="submit" class="btn btn-success" style="width:100%;">Payment Verification Submit</button>
        </form>
    </div>

    <script>
        document.getElementById('payForm').addEventListener('submit', function(e){
            e.preventDefault();
            const id = document.getElementById('nivedanId').value.trim();
            const code = document.getElementById('esewaCode').value.trim();
            
            processPayment(id, code).then(() => {
                alert("भुक्तानी विवरण दर्ता भयो! अब तपाईं PAID PRINT गर्न सक्नुहुन्छ।");
                window.location.href = "../trace/trace.html?id=" + id;
            });
        });
    </script>
</body>
</html>
