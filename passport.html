<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>पासपोर्ट फोटो जेनेरेटर - रोहिणी-१</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 15px; }
        .controls { max-width: 650px; margin: 0 auto 20px auto; background: #ffffff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .controls h2 { font-size: 18px; margin-bottom: 15px; color: #1e3799; text-align: center; }
        .top-home-btn { display: inline-block; margin-bottom: 15px; text-decoration: none; background: #1e3799; color: white; padding: 6px 12px; border-radius: 5px; font-size: 13px; font-weight: bold; }
        .customer-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; background: #fff3cd; padding: 12px; border-radius: 8px; border: 1px solid #ffeeba; }
        .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 15px; background: #eef2f5; padding: 12px; border-radius: 8px; }
        .config-item { display: flex; flex-direction: column; }
        .config-item label, .customer-info label { font-size: 12px; font-weight: bold; color: #555; margin-bottom: 4px; }
        .config-item input, .config-item select, .customer-info input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .upload-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 10px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px; }
        .upload-item input[type="file"] { flex: 1; font-size: 12px; }
        .upload-item input[type="number"] { width: 70px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-add { background-color: #27ae60; color: white; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .btn-generate { width: 100%; padding: 12px; background-color: #1e3799; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-direct-print { background-color: #17a2b8; color: white; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 15px; display: none; }
        .print-page { width: 210mm; min-height: 297mm; background: white; margin: 0 auto; padding: 2mm 8mm; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: flex; flex-wrap: wrap; align-content: flex-start; }
        .photo-box { overflow: hidden; background: #fafafa; flex-shrink: 0; box-sizing: border-box; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; box-sizing: border-box; }
        @media print {
            body { background: white; padding: 0; }
            .controls, .btn-direct-print, .top-home-btn { display: none !important; }
            .print-page { box-shadow: none; margin: 0; padding: 8mm 6mm; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <a href="index.html" class="top-home-btn">← गृह पृष्ठमा जानुहोस्</a>
        <h2>पासपोर्ट साइज फोटो जेनेरेटर</h2>
        
        <div class="customer-info">
            <div class="config-item">
                <label>ग्राहकको नाम:</label>
                <input type="text" id="custName" placeholder="पूरा नाम" required>
            </div>
            <div class="config-item">
                <label>मोबाइल नम्बर:</label>
                <input type="text" id="custPhone" placeholder="९८XXXXXXXX" required>
            </div>
        </div>

        <div class="config-grid">
            <div class="config-item">
                <label>चौडाइ (Width):</label>
                <input type="number" id="photoWidth" value="1.2" step="0.1" min="0.5">
            </div>
            <div class="config-item">
                <label>उचाइ (Height):</label>
                <input type="number" id="photoHeight" value="1.5" step="0.1" min="0.5">
            </div>
            <div class="config-item">
                <label>युनिट:</label>
                <select id="sizeUnit">
                    <option value="in" selected>Inches</option>
                    <option value="mm">MM</option>
                </select>
            </div>
            <div class="config-item">
                <label>ग्याप (mm):</label>
                <input type="number" id="photoGap" value="2" min="0" max="20">
            </div>
            <div class="config-item">
                <label>बोर्डर (px):</label>
                <input type="number" id="borderWidth" value="1.5" min="0" max="5">
            </div>
        </div>

        <div id="uploadList">
            <div class="upload-item">
                <input type="file" class="photo-input" accept="image/*">
                <label>संख्या:</label>
                <input type="number" class="photo-qty" value="6" min="1">
            </div>
        </div>

        <button class="btn-add" onclick="addNewUploadField()">+ थप फोटो</button>
        <button class="btn-generate" onclick="generatePhotos()">फोटो तयार गर्नुहोस् र पठाउनुहोस्</button>
    </div>

    <div style="text-align: center;">
        <button id="directPrintBtn" class="btn-direct-print" onclick="window.print()">🖨️ प्रिन्ट गर्नुहोस्</button>
    </div>

    <div class="print-page" id="printPage">
        <p id="placeholderText" style="color: #888; font-size: 14px; text-align: center; width: 100%;">विवरण भरेर फोटो छान्नुहोस् र बटन थिच्नुहोस्।</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAVKcK8eTv1W0FtJZX_0vRQ5Vvq52f7BIM",
            databaseURL: "https://sunil-online-service-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function addNewUploadField() {
            const uploadList = document.getElementById('uploadList');
            const newItem = document.createElement('div');
            newItem.className = 'upload-item';
            newItem.innerHTML = `
                <input type="file" class="photo-input" accept="image/*">
                <label>संख्या:</label>
                <input type="number" class="photo-qty" value="6" min="1">
            `;
            uploadList.appendChild(newItem);
        }

        async function generatePhotos() {
            const custName = document.getElementById('custName').value.trim();
            const custPhone = document.getElementById('custPhone').value.trim();

            if (!custName || !custPhone) {
                alert("कृपया ग्राहकको नाम र मोबाइल नम्बर अनिवार्य भर्नुहोला!");
                return;
            }

            const printPage = document.getElementById('printPage');
            const directPrintBtn = document.getElementById('directPrintBtn');
            const inputs = document.querySelectorAll('.photo-input');
            const quantities = document.querySelectorAll('.photo-qty');
            
            const widthVal = document.getElementById('photoWidth').value;
            const heightVal = document.getElementById('photoHeight').value;
            const unitVal = document.getElementById('sizeUnit').value;
            const gapVal = document.getElementById('photoGap').value;
            const borderVal = document.getElementById('borderWidth').value;

            printPage.style.gap = `${gapVal}mm`;
            printPage.innerHTML = '';
            let imagePromises = [];
            let totalPhotosCount = 0;
            let capturedImageData = ""; // फोटो सेभ गर्नको लागि variable

            inputs.forEach((input, index) => {
                const file = input.files[0];
                const count = parseInt(quantities[index].value) || 0;

                if (file && count > 0) {
                    totalPhotosCount += count;
                    const promise = new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            capturedImageData = e.target.result; // Base64 image data समात्ने
                            for (let i = 0; i < count; i++) {
                                const box = document.createElement('div');
                                box.className = 'photo-box';
                                box.style.width = `${widthVal}${unitVal}`;
                                box.style.height = `${heightVal}${unitVal}`;

                                const img = document.createElement('img');
                                img.src = capturedImageData;
                                img.style.border = `${borderVal}px solid #000000`;

                                box.appendChild(img);
                                printPage.appendChild(box);
                            }
                            resolve();
                        };
                        reader.readAsDataURL(file);
                    });
                    imagePromises.push(promise);
                }
            });

            if (imagePromises.length === 0) {
                printPage.innerHTML = '<p style="color: red; text-align: center; width: 100%;">कृपया कम्तीमा एउटा फोटो छान्नुहोस्!</p>';
                directPrintBtn.style.display = 'none';
                return;
            }

            await Promise.all(imagePromises);
            
            const uniqueId = 'PASSPORT-' + Date.now();
            
            // Firebase मा फोटोको डाटा (imageBase64) समेत सेभ गर्ने
            db.ref('rochini_nivedans/' + uniqueId).set({
                id: uniqueId,
                name: custName,
                phone: custPhone,
                status: 'Pending',
                isVerified: false,
                totalPhotos: totalPhotosCount,
                serviceType: 'Passport',
                imageBase64: capturedImageData, // यो लाइनले एड्मिनमा फोटो देखाउन मद्दत गर्छ
                today: new Date().toLocaleDateString(),
                timestamp: new Date().toLocaleString()
            }, (error) => {
                if (error) {
                    alert("डाटा सेभ हुन सकेन: " + error.message);
                } else {
                    alert("सफलतापूर्वक एड्मिन प्यानलमा पठाइयो!");
                }
            });

            directPrintBtn.style.display = 'inline-block';
        }
    </script>

</body>
</html>
