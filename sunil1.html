        let baseScale = 1, userZoom = 1, imgX = 0, imgY = 0;
        let isModalDragging = false, modalStartX, modalStartY;

        document.querySelectorAll('.custom-box.photo-type').forEach(box => {
            let uploadBtn = box.querySelector('.upload-btn-overlay');
            let imgTag = box.querySelector('.preview-img-tag');
            let hiddenInput = box.querySelector('input[type="file"]');

            if (!hiddenInput) {
                hiddenInput = document.createElement('input');
                hiddenInput.type = 'file';
                hiddenInput.accept = 'image/*';
                hiddenInput.style.display = 'none';
                box.appendChild(hiddenInput);
            }

            if (!uploadBtn) {
                uploadBtn = document.createElement('button');
                uploadBtn.className = 'upload-btn-overlay';
                uploadBtn.innerText = imgTag && imgTag.style.display !== 'none' ? '🔄' : '📷 फोटो';
                box.appendChild(uploadBtn);
            }

            uploadBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                hiddenInput.click();
            });

            hiddenInput.addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        activeImage = new Image();
                        activeImage.onload = function() {
                            currentTargetImgTag = imgTag;
                            currentTargetBtn = uploadBtn;
                            openCropModal();
                        };
                        activeImage.src = evt.target.result;
                    };
                    reader.readAsDataURL(e.target.files[0]);
                }
            });
        });

        document.querySelectorAll('.text-box-content').forEach(el => {
            el.setAttribute('contenteditable', 'true');
        });

        const cropModal = document.getElementById('cropModal');
        const cropImg = document.getElementById('cropImg');
        const zoomSlider = document.getElementById('zoomSlider');
        const cropContainer = document.getElementById('cropContainer');

        function openCropModal() {
            cropImg.src = activeImage.src;
            baseScale = Math.max(200 / activeImage.naturalWidth, 250 / activeImage.naturalHeight);
            userZoom = 1; 
            zoomSlider.value = 1;
            imgX = (200 - activeImage.naturalWidth * baseScale) / 2;
            imgY = (250 - activeImage.naturalHeight * baseScale) / 2;
            updateCropTransform();
            cropModal.style.display = 'flex';
        }

        zoomSlider.addEventListener('input', function() {
            userZoom = parseFloat(this.value);
            updateCropTransform();
        });

        function startModalDrag(e) {
            isModalDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            modalStartX = clientX - imgX;
            modalStartY = clientY - imgY;

            window.addEventListener('mousemove', doModalDrag);
            window.addEventListener('touchmove', doModalDrag, { passive: false });
            window.addEventListener('mouseup', stopModalDrag);
            window.addEventListener('touchend', stopModalDrag);
        }

        function doModalDrag(e) {
            if (!isModalDragging) return;
            if (e.cancelable) e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            imgX = clientX - modalStartX;
            imgY = clientY - modalStartY;
            updateCropTransform();
        }

        function stopModalDrag() {
            isModalDragging = false;
        }

        cropContainer.addEventListener('mousedown', startModalDrag);
        cropContainer.addEventListener('touchstart', startModalDrag, { passive: false });

        function updateCropTransform() {
            const sc = baseScale * userZoom;
            cropImg.style.width = `${activeImage.naturalWidth}px`;
            cropImg.style.height = `${activeImage.naturalHeight}px`;
            cropImg.style.transformOrigin = 'top left';
            cropImg.style.transform = `translate(${imgX}px, ${imgY}px) scale(${sc})`;
        }

        function saveCroppedImage() {
            if (!currentTargetImgTag) return;
            const tempCanvas = document.createElement('canvas');
            const ctx = tempCanvas.getContext('2d');
            tempCanvas.width = 400; 
            tempCanvas.height = 500;
            const sf = tempCanvas.width / 200; 
            const finalScale = baseScale * userZoom;

            ctx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
            ctx.save();
            ctx.translate(imgX * sf, imgY * sf);
            ctx.scale(finalScale * sf, finalScale * sf);
            ctx.drawImage(activeImage, 0, 0);
            ctx.restore();

            currentTargetImgTag.src = tempCanvas.toDataURL('image/png');
            currentTargetImgTag.style.display = 'block';
            if (currentTargetBtn) currentTargetBtn.innerText = '🔄';
            cropModal.style.display = 'none';
        }

        function downloadPdfFile() {
            const element = document.getElementById('exportPdfPage');
            const opt = {
                margin:       0,
                filename:     'saved-document.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }

        function downloadJpgFile() {
            const element = document.getElementById('exportPdfPage');
            html2canvas(element, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'saved-document.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
            });
        }
    </script>
</body>
</html>
